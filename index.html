    Rose\n    Geri\n    Matt\n    Chris\n    Suze"}, {"id": 122, "lab": 9, "labNameEn": "File I/O", "labNameAr": "التعامل مع الملفات", "page": 148, "kind": "worked", "titleEn": "Example 7: This program demonstrates how numbers must be converted to strings befor...", "titleAr": "مثال 7 — التعامل مع الملفات", "problemEn": "Study the program below — \"This program demonstrates how numbers must be converted to strings befor...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates how numbers must be converted to strings before they\n      # are written to a text file.\n      def main():\n         # Open a file for writing.\n         outfile = open('numbers.txt', 'w')\n         # Get three numbers from the user.\n         num1 = int(input('Enter a number: '))\n         num2 = int(input('Enter another number: '))\n         num3 = int(input('Enter another number: '))\n          # Write the numbers to the file.\n         outfile.write(str(num1) + '\\n')\n         outfile.write(str(num2) + '\\n')\n         outfile.write(str(num3) + '\\n')\n         # Close the file.\n         outfile.close()\n         print('Data written to numbers.txt')\n      # Call the main function.\n      main()\n\nProgram Output\n\n    Enter a number: 22 [Enter]\n    Enter another number: 14 [Enter]\n    Enter another number: −99 [Enter]\n    Data written to numbers.txt"}, {"id": 123, "lab": 9, "labNameEn": "File I/O", "labNameAr": "التعامل مع الملفات", "page": 149, "kind": "worked", "titleEn": "Example 8: Now the main program that reads numbers from the file", "titleAr": "مثال 8 — التعامل مع الملفات", "problemEn": "Study the program below — \"Now the main program that reads numbers from the file\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "#Now the main program that reads numbers from the file\n    def main():\n      # Open a file for reading.\n      infile = open('numbers.txt', 'r')\n      # Read three numbers from the file and convert from strings to integers.\n      num1 = int(infile.readline())\n      num2 = int(infile.readline())\n      num3 = int(infile.readline())\n      # Close the file.\n      infile.close()\n      # Add the three numbers.\n      total = num1 + num2 + num3\n      # Display the numbers and their total.\n      print(f'The numbers are: {num1}, {num2}, {num3}')\n      print(f'Their total is: {total}')\n    # Call the main function.\n    main()\nProgram Output\n\n    The numbers are: 22, 14, −99\n    Their total is: −63"}, {"id": 124, "lab": 9, "labNameEn": "File I/O", "labNameAr": "التعامل مع الملفات", "page": 150, "kind": "worked", "titleEn": "Example 9: This program prompts the user for sales amounts and writes those amounts...", "titleAr": "مثال 9 — التعامل مع الملفات", "problemEn": "Study the program below — \"This program prompts the user for sales amounts and writes those amounts...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program prompts the user for sales amounts\n      # and writes those amounts to the sales.txt file.\n      def main():\n        # Get the number of days.\n        num_days = int(input('For how many days do you have sales? '))\n        # Open a new file named sales.txt.\n        sales_file = open('sales.txt', 'w')\n        # Get the amount of sales for each day and write it to the file.\n        for count in range(1, num_days + 1):\n      # Get the sales for a day.\n           sales = float(input(f'Enter the sales for day #{count}: '))\n      # Write the sales amount to the file.\n           sales_file.write(f'{sales}\\n')\n       # Close the file.\n        sales_file.close()\n        print('Data written to sales.txt.')\n      # Call the main function.\n      main()\nProgram Output\n\n      For how many days do you have sales? 5 [Enter]\n      Enter the sales for day #1: 1000.0 [Enter]\n      Enter the sales for day #2: 2000.0 [Enter]\n\n      Enter the sales for day #3: 3000.0 [Enter]\n      Enter the sales for day #4: 4000.0 [Enter]\n      Enter the sales for day #5: 5000.0 [Enter]\n      Data written to sales.txt."}, {"id": 125, "lab": 9, "labNameEn": "File I/O", "labNameAr": "التعامل مع الملفات", "page": 151, "kind": "worked", "titleEn": "Example 10: This program reads all of the values in the sales.txt file", "titleAr": "مثال 10 — التعامل مع الملفات", "problemEn": "Study the program below — \"This program reads all of the values in the sales.txt file\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program reads all of the values in the sales.txt file.\n      def main():\n        # Open the sales.txt file for reading.\n        sales_file = open('sales.txt', 'r')\n         # Read the first line from the file, but don't convert to a number yet. We still\n        # need to test for an empty string.\n        line = sales_file.readline()\n        # As long as an empty string is not returned from readline, continue processing.\n           while line != '':\n           # Convert line to a float.\n           amount = float(line)\n           # Format and display the amount.\n           print(f'{amount:.2f}')\n           # Read the next line.\n           line = sales_file.readline()\n        sales_file.close()     # Close the file.\n      # Call the main function.\n      main()\n\nProgram Output\n\n    1000.00\n\n    2000.00\n\n    3000.00\n\n    4000.00\n\n    5000.00"}, {"id": 126, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "page": 156, "kind": "worked", "titleEn": "Example 1: This program calculates gross pay", "titleAr": "مثال 1 — تصحيح الأخطاء ومعالجة الاستثناءات", "problemEn": "Study the program below — \"This program calculates gross pay\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program calculates gross pay.\n    def main():\n      try:\n        # Get the number of hours worked.\n        hours = int(input('How many hours did you work? '))\n        # Get the hourly pay rate.\n        pay_rate = float(input('Enter your hourly pay rate: '))\n        # Calculate the gross pay.\n        gross_pay = hours * pay_rate\n        # Display the gross pay.\n        print(f'Gross pay: ${gross_pay:,.2f}')\n      except ValueError:\n        print('ERROR: Hours worked and hourly pay rate must')\n        print('be valid numbers.')\n    # Call the main function.\n    main()\nProgram Output\n\n    How many hours did you work? forty [Enter]\n    ERROR: Hours worked and hourly pay rate must\n    be valid numbers."}, {"id": 127, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "page": 157, "kind": "worked", "titleEn": "Example 2: This program displays the contents of a file", "titleAr": "مثال 2 — تصحيح الأخطاء ومعالجة الاستثناءات", "problemEn": "Study the program below — \"This program displays the contents of a file\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program displays the contents of a file.\n    def main():\n      # Get the name of a file.\n      filename = input('Enter a filename: ')\n      try:\n        # Open the file.\n        infile = open(filename, 'r')\n        # Read the file's contents.\n        contents = infile.read()\n        # Display the file's contents.\n        print(contents)\n        # Close the file\n        infile.close()\n     except FileNotFoundError:\n        print(f'The file {filename} does not exist.')\n      # Call the main function.\n    main()\n\nProgram Output\n\n     Enter a filename: bad_file.txt [Enter]\n     The file bad_file.txt does not exist."}, {"id": 128, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 12, "kind": "practice", "titleEn": "Practice 1: Write a Python function to find the max of three number...", "titleAr": "تمرين تطبيقي 1 — الدوال: التعريف والاستدعاء", "problemEn": "Write a Python function to find the max of three numbers.", "problemAr": "اكتب دالة بايثون لإيجاد أكبر عدد من بين ثلاثة أعداد.", "solution": "def find_max(a, b, c):\n    return max(a, b, c)\n\nprint(find_max(4, 9, 2))  # 9"}, {"id": 129, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 12, "kind": "practice", "titleEn": "Practice 2: Write a program using a function to display all numbers...", "titleAr": "تمرين تطبيقي 2 — الدوال: التعريف والاستدعاء", "problemEn": "Write a program using a function to display all numbers divisible by 7 within a range.", "problemAr": "اكتب برنامجاً يستخدم دالة لعرض كل الأعداد القابلة للقسمة على 7 ضمن مدى معين.", "solution": "def show_divisible_by_7(start, end):\n    for n in range(start, end + 1):\n        if n % 7 == 0:\n            print(n)\n\nshow_divisible_by_7(1, 50)"}, {"id": 130, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 12, "kind": "practice", "titleEn": "Practice 3: Write a Python program to find the multiplication table...", "titleAr": "تمرين تطبيقي 3 — الدوال: التعريف والاستدعاء", "problemEn": "Write a Python program to find the multiplication table of a given number using functions.", "problemAr": "اكتب برنامج بايثون لطباعة جدول ضرب عدد معين باستخدام الدوال.", "solution": "def multiplication_table(n):\n    for i in range(1, 11):\n        print(f\"{n} x {i} = {n * i}\")\n\nmultiplication_table(6)"}, {"id": 131, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 29, "kind": "practice", "titleEn": "Practice 4: Write a function sumDigits(n) that computes the sum of ...", "titleAr": "تمرين تطبيقي 4 — الدوال: التعريف والاستدعاء", "problemEn": "Write a function sumDigits(n) that computes the sum of the digits in an integer. sumDigits(234) should return 9.", "problemAr": "اكتب دالة sumDigits(n) تحسب مجموع أرقام عدد صحيح. sumDigits(234) يجب أن تُرجع 9.", "solution": "def sumDigits(n):\n    n = abs(n)\n    total = 0\n    while n > 0:\n        total += n % 10\n        n //= 10\n    return total\n\nprint(sumDigits(234))  # 9"}, {"id": 132, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 29, "kind": "practice", "titleEn": "Practice 5: Write a function reverse(number) that displays an integ...", "titleAr": "تمرين تطبيقي 5 — الدوال: التعريف والاستدعاء", "problemEn": "Write a function reverse(number) that displays an integer in reverse order. reverse(3456) should display 6543.", "problemAr": "اكتب دالة reverse(number) تعرض عدداً صحيحاً بترتيب معكوس. reverse(3456) يجب أن تعرض 6543.", "solution": "def reverse(number):\n    print(str(number)[::-1])\n\nnum = int(input(\"Enter an integer: \"))\nreverse(num)"}, {"id": 133, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 29, "kind": "practice", "titleEn": "Practice 6: Write a function displaySortedNumbers(num1, num2, num3)...", "titleAr": "تمرين تطبيقي 6 — الدوال: التعريف والاستدعاء", "problemEn": "Write a function displaySortedNumbers(num1, num2, num3) that displays three numbers in ascending order.", "problemAr": "اكتب دالة displaySortedNumbers(num1, num2, num3) تعرض ثلاثة أعداد بترتيب تصاعدي.", "solution": "def displaySortedNumbers(num1, num2, num3):\n    for n in sorted([num1, num2, num3]):\n        print(n)\n\na = float(input(\"Enter first number: \"))\nb = float(input(\"Enter second number: \"))\nc = float(input(\"Enter third number: \"))\ndisplaySortedNumbers(a, b, c)"}, {"id": 134, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 1: Assume the variable name references a string. Write a f...", "titleAr": "تمرين تطبيقي 1 — معالجة النصوص (السلاسل)", "problemEn": "Assume the variable name references a string. Write a for loop that prints each character in the string.", "problemAr": "افترض أن المتغير name يشير إلى نص. اكتب حلقة for تطبع كل حرف في هذا النص.", "solution": "name = \"Python\"\nfor ch in name:\n    print(ch)"}, {"id": 135, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 2: Write a program to concatenate two strings into another...", "titleAr": "تمرين تطبيقي 2 — معالجة النصوص (السلاسل)", "problemEn": "Write a program to concatenate two strings into another string.", "problemAr": "اكتب برنامجاً يقوم بدمج (تجميع) نصين في نص واحد.", "solution": "str1 = input(\"Enter first string: \")\nstr2 = input(\"Enter second string: \")\nresult = str1 + str2\nprint(\"Concatenated string:\", result)"}, {"id": 136, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 3: Write a loop that counts the number of space characters...", "titleAr": "تمرين تطبيقي 3 — معالجة النصوص (السلاسل)", "problemEn": "Write a loop that counts the number of space characters that appear in the string referenced by mystring.", "problemAr": "اكتب حلقة تحسب عدد المسافات (الفراغات) الموجودة في النص الذي يشير إليه mystring.", "solution": "mystring = \"Programming is fun to learn\"\ncount = 0\nfor ch in mystring:\n    if ch == ' ':\n        count += 1\nprint(\"Number of spaces:\", count)"}, {"id": 137, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 4: Write a loop that counts the number of digits that appe...", "titleAr": "تمرين تطبيقي 4 — معالجة النصوص (السلاسل)", "problemEn": "Write a loop that counts the number of digits that appear in the string referenced by mystring.", "problemAr": "اكتب حلقة تحسب عدد الأرقام الموجودة في النص الذي يشير إليه mystring.", "solution": "mystring = \"Room 101 has 25 seats\"\ncount = 0\nfor ch in mystring:\n    if ch.isdigit():\n        count += 1\nprint(\"Number of digits:\", count)"}, {"id": 138, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 5: Write a function that accepts a string as an argument a...", "titleAr": "تمرين تطبيقي 5 — معالجة النصوص (السلاسل)", "problemEn": "Write a function that accepts a string as an argument and returns True if the argument ends with the substring '.com'.", "problemAr": "اكتب دالة تستقبل نصاً وتُرجع True إذا كان هذا النص ينتهي بالنص الفرعي '.com'.", "solution": "def ends_with_com(text):\n    return text.endswith('.com')\n\nprint(ends_with_com(\"example.com\"))  # True\nprint(ends_with_com(\"example.net\"))  # False"}, {"id": 139, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 6: Write a program to count the total number of vowels, co...", "titleAr": "تمرين تطبيقي 6 — معالجة النصوص (السلاسل)", "problemEn": "Write a program to count the total number of vowels, consonants, and blanks in a string.", "problemAr": "اكتب برنامجاً يحسب العدد الكلي لحروف العلة والحروف الساكنة والفراغات في نص.", "solution": "text = input(\"Enter a string: \")\nvowels = consonants = blanks = 0\nfor ch in text.lower():\n    if ch == ' ':\n        blanks += 1\n    elif ch in 'aeiou':\n        vowels += 1\n    elif ch.isalpha():\n        consonants += 1\nprint(\"Vowels:\", vowels)\nprint(\"Consonants:\", consonants)\nprint(\"Blanks:\", blanks)"}, {"id": 140, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 38, "kind": "practice", "titleEn": "Practice 7: Write a program to calculate the length of a string wit...", "titleAr": "تمرين تطبيقي 7 — معالجة النصوص (السلاسل)", "problemEn": "Write a program to calculate the length of a string without using the built-in len() function.", "problemAr": "اكتب برنامجاً يحسب طول نص دون استخدام الدالة الجاهزة len().", "solution": "text = input(\"Enter a string: \")\ncount = 0\nfor ch in text:\n    count += 1\nprint(\"Length of the string is:\", count)"}, {"id": 141, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 1: Write a Python program that accepts a sentence and calc...", "titleAr": "تمرين تطبيقي 1 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Write a Python program that accepts a sentence and calculates the number of words, digits, uppercase letters, and lowercase letters.", "problemAr": "اكتب برنامج بايثون يستقبل جملة ويحسب عدد الكلمات والأرقام والحروف الكبيرة والحروف الصغيرة.", "solution": "sentence = input(\"Enter a sentence: \")\nwords = len(sentence.split())\ndigits = sum(1 for c in sentence if c.isdigit())\nupper = sum(1 for c in sentence if c.isupper())\nlower = sum(1 for c in sentence if c.islower())\nprint(\"Words:\", words)\nprint(\"Digits:\", digits)\nprint(\"Uppercase letters:\", upper)\nprint(\"Lowercase letters:\", lower)"}, {"id": 142, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 2: Write a Python program to convert uppercase letters to ...", "titleAr": "تمرين تطبيقي 2 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Write a Python program to convert uppercase letters to lowercase and vice versa.", "problemAr": "اكتب برنامج بايثون لتحويل الحروف الكبيرة إلى صغيرة والعكس.", "solution": "text = input(\"Enter a string: \")\nprint(\"Swapped case:\", text.swapcase())"}, {"id": 143, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 3: Write a Python program to count the occurrence of a use...", "titleAr": "تمرين تطبيقي 3 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Write a Python program to count the occurrence of a user-entered word in a sentence.", "problemAr": "اكتب برنامج بايثون يحسب عدد مرات تكرار كلمة يدخلها المستخدم داخل جملة.", "solution": "sentence = input(\"Enter a sentence: \")\nword = input(\"Enter the word to count: \")\ncount = sentence.lower().split().count(word.lower())\nprint(f\"'{word}' appeared {count} time(s).\")"}, {"id": 144, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 4: Write code that makes a copy of a string with all occur...", "titleAr": "تمرين تطبيقي 4 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Write code that makes a copy of a string with all occurrences of the lowercase letter 't' converted to uppercase.", "problemAr": "اكتب كوداً ينشئ نسخة من نص يتم فيها تحويل جميع الأحرف 't' الصغيرة إلى أحرف كبيرة.", "solution": "text = \"the tallest tower\"\nnew_text = text.replace('t', 'T')\nprint(new_text)"}, {"id": 145, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 5: Write a function that accepts a string as an argument a...", "titleAr": "تمرين تطبيقي 5 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Write a function that accepts a string as an argument and displays the string backwards.", "problemAr": "اكتب دالة تستقبل نصاً وتعرضه معكوساً.", "solution": "def display_backwards(text):\n    print(text[::-1])\n\ndisplay_backwards(\"Python\")"}, {"id": 146, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 6: Assume mystring references a string. Write a statement ...", "titleAr": "تمرين تطبيقي 6 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Assume mystring references a string. Write a statement that uses a slicing expression and displays the first 3 characters.", "problemAr": "افترض أن mystring يشير إلى نص. اكتب جملة تستخدم تعبير تقطيع (slicing) لعرض أول 3 أحرف.", "solution": "mystring = \"Programming\"\nprint(mystring[:3])"}, {"id": 147, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 53, "kind": "practice", "titleEn": "Practice 7: Assume mystring references a string. Write a statement ...", "titleAr": "تمرين تطبيقي 7 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Assume mystring references a string. Write a statement that uses a slicing expression and displays the last 3 characters.", "problemAr": "افترض أن mystring يشير إلى نص. اكتب جملة تستخدم تعبير تقطيع (slicing) لعرض آخر 3 أحرف.", "solution": "mystring = \"Programming\"\nprint(mystring[-3:])"}, {"id": 148, "lab": 5, "labNameEn": "Lists: Basics", "labNameAr": "القوائم: الأساسيات", "page": 66, "kind": "practice", "titleEn": "Practice 1: students = ['Ali','Fatema','Omer','Sara','Ahmed','Esra'...", "titleAr": "تمرين تطبيقي 1 — القوائم: الأساسيات", "problemEn": "students = ['Ali','Fatema','Omer','Sara','Ahmed','Esra']. Mona joins the class; add her to the end of the roster.", "problemAr": "students = ['Ali','Fatema','Omer','Sara','Ahmed','Esra']. انضمت منى إلى الصف؛ أضفها إلى نهاية القائمة.", "solution": "students = [\"Ali\", \"Fatema\", \"Omer\", \"Sara\", \"Ahmed\", \"Esra\"]\nstudents.append(\"Mona\")\nprint(students)"}, {"id": 149, "lab": 5, "labNameEn": "Lists: Basics", "labNameAr": "القوائم: الأساسيات", "page": 66, "kind": "practice", "titleEn": "Practice 2: Ali transfers to another class. Write code to remove hi...", "titleAr": "تمرين تطبيقي 2 — القوائم: الأساسيات", "problemEn": "Ali transfers to another class. Write code to remove him from the list.", "problemAr": "انتقل علي إلى صف آخر. اكتب كوداً لإزالته من القائمة.", "solution": "students = [\"Ali\", \"Fatema\", \"Omer\", \"Sara\", \"Ahmed\", \"Esra\"]\nstudents.remove(\"Ali\")\nprint(students)"}, {"id": 150, "lab": 5, "labNameEn": "Lists: Basics", "labNameAr": "القوائم: الأساسيات", "page": 66, "kind": "practice", "titleEn": "Practice 3: The teacher wants study groups: write code to create a ...", "titleAr": "تمرين تطبيقي 3 — القوائم: الأساسيات", "problemEn": "The teacher wants study groups: write code to create a new list containing only the first 3 students.", "problemAr": "المعلمة تريد تكوين مجموعات دراسية: اكتب كوداً لإنشاء قائمة جديدة تحتوي فقط على أول 3 طلاب.", "solution": "students = [\"Ali\", \"Fatema\", \"Omer\", \"Sara\", \"Ahmed\", \"Esra\"]\ngroup1 = students[:3]\nprint(group1)"}, {"id": 151, "lab": 5, "labNameEn": "Lists: Basics", "labNameAr": "القوائم: الأساسيات", "page": 66, "kind": "practice", "titleEn": "Practice 4: inventory = ['apples','bananas','oranges','milk','eggs'...", "titleAr": "تمرين تطبيقي 4 — القوائم: الأساسيات", "problemEn": "inventory = ['apples','bananas','oranges','milk','eggs','bread','cheese']. Check if 'milk' is in stock.", "problemAr": "inventory = ['apples','bananas','oranges','milk','eggs','bread','cheese']. تحقق مما إذا كان 'milk' متوفراً.", "solution": "inventory = [\"apples\", \"bananas\", \"oranges\", \"milk\", \"eggs\", \"bread\", \"cheese\"]\nif \"milk\" in inventory:\n    print(\"Milk is in stock.\")\nelse:\n    print(\"Milk is out of stock.\")"}, {"id": 152, "lab": 6, "labNameEn": "Lists: Methods & del", "labNameAr": "القوائم: الدوال وجملة del", "page": 83, "kind": "practice", "titleEn": "Practice 1: Ask the user to enter a series of 20 numbers, store the...", "titleAr": "تمرين تطبيقي 1 — القوائم: الدوال وجملة del", "problemEn": "Ask the user to enter a series of 20 numbers, store them in a list, then display the lowest, highest, total, and average.", "problemAr": "اطلب من المستخدم إدخال 20 عدداً وخزّنها في قائمة، ثم اعرض الأصغر والأكبر والمجموع والمتوسط.", "solution": "numbers = []\nfor i in range(20):\n    value = float(input(f\"Enter number {i+1}: \"))\n    numbers.append(value)\n\nprint(\"Lowest:\", min(numbers))\nprint(\"Highest:\", max(numbers))\nprint(\"Total:\", sum(numbers))\nprint(\"Average:\", sum(numbers) / len(numbers))"}, {"id": 153, "lab": 6, "labNameEn": "Lists: Methods & del", "labNameAr": "القوائم: الدوال وجملة del", "page": 83, "kind": "practice", "titleEn": "Practice 2: Write a function that accepts a list and a number n, an...", "titleAr": "تمرين تطبيقي 2 — القوائم: الدوال وجملة del", "problemEn": "Write a function that accepts a list and a number n, and displays all numbers in the list greater than n.", "problemAr": "اكتب دالة تستقبل قائمة وعدداً n، وتعرض كل الأعداد في القائمة الأكبر من n.", "solution": "def show_greater_than(numbers, n):\n    for num in numbers:\n        if num > n:\n            print(num)\n\nshow_greater_than([3, 12, 7, 25, 9], 8)"}, {"id": 154, "lab": 6, "labNameEn": "Lists: Methods & del", "labNameAr": "القوائم: الدوال وجملة del", "page": 83, "kind": "practice", "titleEn": "Practice 3: Ask the user to enter a store's sales for each day of t...", "titleAr": "تمرين تطبيقي 3 — القوائم: الدوال وجملة del", "problemEn": "Ask the user to enter a store's sales for each day of the week, store them in a list, and calculate the total sales.", "problemAr": "اطلب من المستخدم إدخال مبيعات المتجر لكل يوم من أيام الأسبوع، خزّنها في قائمة، واحسب مجموع المبيعات.", "solution": "sales = []\nfor day in range(7):\n    amount = float(input(f\"Enter sales for day {day+1}: \"))\n    sales.append(amount)\n\ntotal = sum(sales)\nprint(\"Total weekly sales:\", total)"}, {"id": 155, "lab": 6, "labNameEn": "Lists: Methods & del", "labNameAr": "القوائم: الدوال وجملة del", "page": 83, "kind": "practice", "titleEn": "Practice 4: Write a statement that creates a 5x3 two-dimensional li...", "titleAr": "تمرين تطبيقي 4 — القوائم: الدوال وجملة del", "problemEn": "Write a statement that creates a 5x3 two-dimensional list, then use nested loops to get an integer value from the user for each element.", "problemAr": "اكتب جملة تنشئ قائمة ثنائية الأبعاد بحجم 5×3، ثم استخدم حلقات متداخلة لإدخال قيمة صحيحة من المستخدم لكل عنصر.", "solution": "grid = [[0] * 3 for _ in range(5)]\nfor row in range(5):\n    for col in range(3):\n        grid[row][col] = int(input(f\"Enter value for row {row}, col {col}: \"))\nprint(grid)"}, {"id": 156, "lab": 7, "labNameEn": "Dictionaries", "labNameAr": "القواميس", "page": 105, "kind": "practice", "titleEn": "Practice 1: Write a Python program to count the number of character...", "titleAr": "تمرين تطبيقي 1 — القواميس", "problemEn": "Write a Python program to count the number of characters in a string using dictionaries.", "problemAr": "اكتب برنامج بايثون يحسب عدد تكرار كل حرف في نص باستخدام القواميس.", "solution": "text = input(\"Enter a string: \")\nchar_count = {}\nfor ch in text:\n    char_count[ch] = char_count.get(ch, 0) + 1\nprint(char_count)"}, {"id": 157, "lab": 7, "labNameEn": "Dictionaries", "labNameAr": "القواميس", "page": 105, "kind": "practice", "titleEn": "Practice 2: Write a program that accepts a sentence and calculates ...", "titleAr": "تمرين تطبيقي 2 — القواميس", "problemEn": "Write a program that accepts a sentence and calculates the number of digits, uppercase, and lowercase letters using a dictionary.", "problemAr": "اكتب برنامجاً يستقبل جملة ويحسب عدد الأرقام والحروف الكبيرة والصغيرة باستخدام قاموس.", "solution": "sentence = input(\"Enter a sentence: \")\nstats = {\"digits\": 0, \"upper\": 0, \"lower\": 0}\nfor ch in sentence:\n    if ch.isdigit():\n        stats[\"digits\"] += 1\n    elif ch.isupper():\n        stats[\"upper\"] += 1\n    elif ch.islower():\n        stats[\"lower\"] += 1\nprint(stats)"}, {"id": 158, "lab": 7, "labNameEn": "Dictionaries", "labNameAr": "القواميس", "page": 105, "kind": "practice", "titleEn": "Practice 3: Write a function that prompts the user for the average ...", "titleAr": "تمرين تطبيقي 3 — القواميس", "problemEn": "Write a function that prompts the user for the average temperature for each day of the week and returns a dictionary of the results.", "problemAr": "اكتب دالة تطلب من المستخدم إدخال متوسط درجة الحرارة لكل يوم من أيام الأسبوع وتُرجع قاموساً بالنتائج.", "solution": "def get_weekly_temps():\n    days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']\n    temps = {}\n    for day in days:\n        temps[day] = float(input(f\"Enter average temperature for {day}: \"))\n    return temps\n\nprint(get_weekly_temps())"}, {"id": 159, "lab": 7, "labNameEn": "Dictionaries", "labNameAr": "القواميس", "page": 105, "kind": "practice", "titleEn": "Practice 4: Write a program with a dictionary of friends' names as ...", "titleAr": "تمرين تطبيقي 4 — القواميس", "problemEn": "Write a program with a dictionary of friends' names as keys and phone numbers as values. Print it sorted, then check/add a name.", "problemAr": "اكتب برنامجاً يحتوي على قاموس بأسماء الأصدقاء كمفاتيح وأرقام الهواتف كقيم. اطبعه مرتباً، ثم تحقق من اسم أو أضفه.", "solution": "friends = {\"Sara\": \"0912345\", \"Ali\": \"0919876\", \"Mona\": \"0911111\"}\nfor name in sorted(friends):\n    print(name, \":\", friends[name])\n\nquery = input(\"Enter a name to search: \")\nif query in friends:\n    print(f\"{query}'s number is {friends[query]}\")\nelse:\n    number = input(f\"{query} not found. Enter their number to add: \")\n    friends[query] = number\n    print(\"Added.\", friends)"}, {"id": 160, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 1: Write a Python program to swap two numbers without usin...", "titleAr": "تمرين تطبيقي 1 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a Python program to swap two numbers without using an intermediate/temporary variable. Prompt the user for input.", "problemAr": "اكتب برنامج بايثون لتبديل قيمتي عددين دون استخدام متغير وسيط. اطلب الإدخال من المستخدم.", "solution": "a = int(input(\"Enter first number: \"))\nb = int(input(\"Enter second number: \"))\na, b = b, a\nprint(\"After swap: a =\", a, \", b =\", b)"}, {"id": 161, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 2: Write a program to check whether an item exists within ...", "titleAr": "تمرين تطبيقي 2 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program to check whether an item exists within a tuple.", "problemAr": "اكتب برنامجاً للتحقق مما إذا كان عنصر ما موجوداً داخل صف (tuple).", "solution": "fruits = (\"apple\", \"banana\", \"cherry\")\nitem = input(\"Enter an item to search for: \")\nif item in fruits:\n    print(f\"{item} exists in the tuple.\")\nelse:\n    print(f\"{item} does not exist in the tuple.\")"}, {"id": 162, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 3: Write a program to create an intersection, union, set d...", "titleAr": "تمرين تطبيقي 3 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program to create an intersection, union, set difference, and symmetric difference of sets.", "problemAr": "اكتب برنامجاً لإيجاد تقاطع واتحاد وفرق وفرق تناظري بين مجموعتين.", "solution": "set1 = {1, 2, 3, 4, 5}\nset2 = {4, 5, 6, 7, 8}\nprint(\"Union:\", set1.union(set2))\nprint(\"Intersection:\", set1.intersection(set2))\nprint(\"Difference:\", set1.difference(set2))\nprint(\"Symmetric Difference:\", set1.symmetric_difference(set2))"}, {"id": 163, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 4: Write a program to demonstrate the use of the issubset(...", "titleAr": "تمرين تطبيقي 4 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program to demonstrate the use of the issubset() and issuperset() methods.", "problemAr": "اكتب برنامجاً يوضح استخدام الدالتين issubset() و issuperset().", "solution": "set1 = {1, 2, 3}\nset2 = {1, 2, 3, 4, 5}\nprint(\"set1 is a subset of set2:\", set1.issubset(set2))\nprint(\"set2 is a superset of set1:\", set2.issuperset(set1))"}, {"id": 164, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 5: Write a program that takes a range and creates a list o...", "titleAr": "تمرين تطبيقي 5 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program that takes a range and creates a list of tuples, each with a number and its square.", "problemAr": "اكتب برنامجاً يأخذ مدى ويُنشئ قائمة من الصفوف (tuples)، كل صف يحتوي على عدد ومربعه.", "solution": "start = int(input(\"Start: \"))\nend = int(input(\"End: \"))\nresult = [(n, n ** 2) for n in range(start, end + 1)]\nprint(result)"}, {"id": 165, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 6: Write a program to clear a set.", "titleAr": "تمرين تطبيقي 6 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program to clear a set.", "problemAr": "اكتب برنامجاً لإفراغ (مسح) مجموعة.", "solution": "my_set = {1, 2, 3}\nprint(\"Before:\", my_set)\nmy_set.clear()\nprint(\"After:\", my_set)"}, {"id": 166, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 7: Write a program to find the length of a set.", "titleAr": "تمرين تطبيقي 7 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Write a program to find the length of a set.", "problemAr": "اكتب برنامجاً لإيجاد طول (عدد عناصر) مجموعة.", "solution": "my_set = {10, 20, 30, 40}\nprint(\"Length of the set:\", len(my_set))"}, {"id": 167, "lab": 8, "labNameEn": "Tuples and Sets", "labNameAr": "الصفوف (Tuples) والمجموعات (Sets)", "page": 135, "kind": "practice", "titleEn": "Practice 8: Assume set1 and set2 reference sets. Write a program th...", "titleAr": "تمرين تطبيقي 8 — الصفوف (Tuples) والمجموعات (Sets)", "problemEn": "Assume set1 and set2 reference sets. Write a program that creates set3 containing all elements of both sets.", "problemAr": "افترض أن set1 و set2 يشيرا   function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sampleN(arr, n) {
    return shuffle(arr).slice(0, Math.min(n, arr.length));
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Lightweight Python-ish syntax highlighter (regex based, safe/escaped)
  const PY_KEYWORDS = ["def","return","if","elif","else","for","while","in","not","and","or","import","from","as","class","try","except","finally","raise","pass","break","continue","with","lambda","global","del","is","None","True","False","yield"];
  const PY_BUILTINS = ["print","input","len","range","open","int","float","str","list","tuple","set","dict","sum","min","max","sorted","enumerate","type","abs"];

  function highlightPython(code) {
    const escaped = escapeHtml(code);
    const lines = escaped.split("\n");
    return lines.map(line => highlightLine(line)).join("\n");
  }

  function highlightLine(line) {
    // Extract comment first (naive, ok for teaching snippets)
    let commentIdx = -1;
    let inStr = false, strChar = null;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inStr) {
        if (ch === strChar && line[i-1] !== "\\") inStr = false;
      } else if (ch === "'" || ch === '"') {
        inStr = true; strChar = ch;
      } else if (ch === "#") {
        commentIdx = i; break;
      }
    }
    let code = line, comment = "";
    if (commentIdx >= 0) {
      code = line.slice(0, commentIdx);
      comment = line.slice(commentIdx);
    }
    // Tokenize code part: strings, numbers, keywords, builtins, function-defs
    let out = "";
    let i = 0;
    while (i < code.length) {
      const ch = code[i];
      if (ch === "'" || ch === '"') {
        let j = i + 1;
        while (j < code.length && code[j] !== ch) {
          if (code[j] === "\\") j++;
          j++;
        }
        j = Math.min(j + 1, code.length);
        out += `<span class="tok-str">${code.slice(i, j)}</span>`;
        i = j;
        continue;
      }
      const wordMatch = /^[A-Za-z_][A-Za-z0-9_]*/.exec(code.slice(i));
      if (wordMatch) {
        const w = wordMatch[0];
        if (PY_KEYWORDS.includes(w)) {
          out += `<span class="tok-kw">${w}</span>`;
        } else if (PY_BUILTINS.includes(w)) {
          out += `<span class="tok-builtin">${w}</span>`;
        } else {
          // check if followed by "(" and preceded by "def " for function name styling
          out += w;
        }
        i += w.length;
        continue;
      }
      const numMatch = /^\d+(\.\d+)?/.exec(code.slice(i));
      if (numMatch) {
        out += `<span class="tok-num">${numMatch[0]}</span>`;
        i += numMatch[0].length;
        continue;
      }
      out += escapeHtmlChar(ch);
      i++;
    }
    if (comment) {
      out += `<span class="tok-com">${comment}</span>`;
    }
    return out;
  }
  function escapeHtmlChar(ch) { return ch; } // already escaped upstream

          <div class="summary-header-left">
            <div class="summary-num">${String(lab.lab).padStart(2, "0")}</div>
            <div class="summary-title">${escapeHtml(name)}</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="summary-body">
          <div class="summary-body-inner">
            <ul class="summary-bullets">
              ${bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
            </ul>
          </div>
        </div>`;
      const header = item.querySelector(".summary-header");
      header.addEventListener("click", () => item.classList.toggle("open"));
      header.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); item.classList.toggle("open"); } });
      if (idx === 0) item.classList.add("open");
      list.appendChild(item);
    });

    document.getElementById("btnStartTheoryQuiz").onclick = () => startQuiz("theory");
  }

  /* ---------------------------------------------------------------
     PRACTICAL TAB
     --------------------------------------------------------------- */
  function renderPracticalTab() {
    document.getElementById("btnStartPracticalQuiz").onclick = () => startQuiz("practical");
  }

  /* ---------------------------------------------------------------
     EXAMPLES & EXERCISES TAB
     --------------------------------------------------------------- */
  function renderExamplesTab() {
    const labFilter = document.getElementById("labFilter");
    const currentVal = labFilter.value || "all";
    labFilter.innerHTML = "";
    const optAll = document.createElement("option");
    optAll.value = "all";
    optAll.textContent = t("allLabs");
    labFilter.appendChild(optAll);
    DATA.labs.forEach(lab => {
      const opt = document.createElement("option");
      opt.value = String(lab.id);
      opt.textContent = `${t("lab")} ${lab.id} — ${state.lang === "ar" ? lab.nameAr : lab.nameEn}`;
      labFilter.appendChild(opt);
    });
    labFilter.value = currentVal;
    labFilter.onchange = renderExerciseList;
    renderExerciseList();
  }

  function renderExerciseList() {
    const labFilter = document.getElementById("labFilter");
    const val = labFilter.value;
    const filtered = val === "all" ? DATA.exercises : DATA.exercises.filter(e => String(e.lab) === val);
    document.getElementById("exerciseCount").textContent = t("exercisesFound", filtered.length);

    const list = document.getElementById("exerciseList");
    list.innerHTML = "";
    filtered.forEach(ex => {
      const item = document.createElement("div");
      item.className = "exercise-item";
      const title = state.lang === "ar" ? ex.titleAr : ex.titleEn;
      const problem = state.lang === "ar" ? ex.problemAr : ex.problemEn;
      const kindBadgeClass = ex.kind === "worked" ? "badge-kind-worked" : "badge-kind-practice";
      const kindLabel = ex.kind === "worked" ? t("example") : t("practice");
      const labName = state.lang === "ar" ? ex.labNameAr : ex.labNameEn;

      item.innerHTML = `
        <div class="exercise-header" tabindex="0" role="button">
          <div class="exercise-header-left">
            <div class="exercise-title">${escapeHtml(title)}</div>
            <div class="exercise-meta">
              <span class="badge ${kindBadgeClass}">${escapeHtml(kindLabel)}</span>
              <span class="badge badge-lab">${escapeHtml(labName)}</span>
              <span class="badge badge-page">${t("page")} ${ex.page}</span>
            </div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="exercise-body">
          <div class="exercise-body-inner">
            <div class="problem-text"><strong>${t("problemLabel")}:</strong> ${escapeHtml(problem)}</div>
            <button class="solution-toggle-btn">${t("showSolution")}</button>
            <div class="solution-block">
              <div class="code-box" dir="ltr">
                <div class="code-box-head">
                  <span class="code-dot r"></span><span class="code-dot y"></span><span class="code-dot g"></span>
                  <span class="code-box-label">solution.py</span>
                </div>
                <pre>${highlightPython(ex.solution)}</pre>
              </div>
            </div>
          </div>
        </div>`;

      const header = item.querySelector(".exercise-header");
      header.addEventListener("click", (e) => {
        item.classList.toggle("open");
      });
      header.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); item.classList.toggle("open"); } });

      const solBtn = item.querySelector(".solution-toggle-btn");
      const solBlock = item.querySelector(".solution-block");
      solBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = solBlock.classList.toggle("open");
        solBtn.textContent = isOpen ? t("hideSolution") : t("showSolution");
      });

      list.appendChild(item);
    });
  }

  /* ---------------------------------------------------------------
     GLOSSARY TAB
     --------------------------------------------------------------- */
  function renderGlossaryTab() {
    const search = document.getElementById("glossarySearch");
    search.oninput = () => renderGlossaryGrid(search.value.trim().toLowerCase());
    renderGlossaryGrid("");
  }

  function renderGlossaryGrid(query) {
    const grid = document.getElementById("glossaryGrid");
    const empty = document.getElementById("glossaryEmpty");
    grid.innerHTML = "";
    const filtered = DATA.glossary.filter(g => {
      if (!query) return true;
      const hay = (g.termEn + " " + g.defEn + " " + g.termAr + " " + g.defAr).toLowerCase();
      return hay.includes(query);
    });
    if (filtered.length === 0) {
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    filtered.forEach(g => {
      const card = document.createElement("div");
      card.className = "glossary-card";
      const term = state.lang === "ar" ? g.termAr : g.termEn;
      const def = state.lang === "ar" ? g.defAr : g.defEn;
      card.innerHTML = `<div class="glossary-term">${escapeHtml(term)}</div><div class="glossary-def">${escapeHtml(def)}</div>`;
      grid.appendChild(card);
    });
  }

  /* ---------------------------------------------------------------
     QUIZ ENGINE
     --------------------------------------------------------------- */
  function startQuiz(pool) {
    const source = pool === "theory" ? DATA.theory : DATA.practical;
    const picked = sampleN(source, 20);
    // Shuffle options per question, remap correct index
    const questions = picked.map(q => {
      const optionOrder = shuffle(q.optsEn.map((_, i) => i));
      return {
        id: q.id,
        qEn: q.qEn, qAr: q.qAr,
        optsEn: optionOrder.map(i => q.optsEn[i]),
        optsAr: optionOrder.map(i => q.optsAr[i]),
        correct: optionOrder.indexOf(q.correct),
      };
    });
    state.quiz = { pool, questions, answers: {}, submitted: false };
    document.getElementById("quizModal").classList.remove("hidden");
    document.body.style.overflow = "hidden";
    renderQuizContent();
  }

  function closeQuiz() {
    document.getElementById("quizModal").classList.add("hidden");
    document.body.style.overflow = "";
    state.quiz = null;
  }

  function updateQuizProgress() {
    const q = state.quiz;
    const answeredCount = Object.keys(q.answers).length;
    const pct = Math.round((answeredCount / q.questions.length) * 100);
    document.getElementById("quizProgressFill").style.width = pct + "%";
    document.getElementById("quizProgressLabel").textContent = t("quizQuestionOf", answeredCount, q.questions.length);
  }

  function isCodeLike(str) {
    return /def |print\(|for |while |import |=\s*\(|\[|\{/.test(str) && str.includes("\n");
  }

  function renderQuizContent() {
    const q = state.quiz;
    const container = document.getElementById("quizContent");
    updateQuizProgress();

    if (!q.submitted) {
      let html = `<div class="quiz-body">`;
      q.questions.forEach((question, idx) => {
        const qText = state.lang === "ar" ? question.qAr : question.qEn;
        const opts = state.lang === "ar" ? question.optsAr : question.optsEn;
        const codeLike = isCodeLike(qText);
        const selected = q.answers[idx];

        html += `<div class="quiz-q-card" data-idx="${idx}">
          <div class="quiz-q-index">${t("quizQuestionOf", idx + 1, q.questions.length)}</div>
          <div class="quiz-q-text ${codeLike ? 'has-code' : ''}"${codeLike ? ' dir="ltr"' : ''}>${codeLike ? highlightPython(qText) : escapeHtml(qText)}</div>
          <div class="quiz-options">`;
        opts.forEach((opt, oi) => {
          const optCodeLike = /^[a-zA-Z_][a-zA-Z0-9_]*\(|def |print\(/.test(opt) && opt.length < 60 && !opt.includes(" the ") && !opt.includes(" a ");
          html += `<div class="quiz-option ${selected === oi ? 'selected' : ''}" data-oi="${oi}">
            <div class="quiz-option-radio"></div>
            <div class="${optCodeLike ? 'quiz-option-code' : ''}"${optCodeLike ? ' dir="ltr"' : ''}>${escapeHtml(opt)}</div>
          </div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>
      <div class="quiz-submit-bar">
        <button class="btn-primary" id="quizSubmitBtn">${t("submitQuiz")}</button>
      </div>`;
      container.innerHTML = html;

      container.querySelectorAll(".quiz-q-card").forEach(card => {
        const idx = parseInt(card.dataset.idx, 10);
        card.querySelectorAll(".quiz-option").forEach(optEl => {
          optEl.addEventListener("click", () => {
            const oi = parseInt(optEl.dataset.oi, 10);
            q.answers[idx] = oi;
            card.querySelectorAll(".quiz-option").forEach(o => o.classList.remove("selected"));
            optEl.classList.add("selected");
            card.classList.remove("unanswered-flag");
            updateQuizProgress();
          });
        });
      });

      document.getElementById("quizSubmitBtn").addEventListener("click", submitQuiz);
    } else {
      renderQuizResults();
    }
  }

  function submitQuiz() {
    const q = state.quiz;
    if (Object.keys(q.answers).length < q.questions.length) {
      // flag unanswered
      document.querySelectorAll(".quiz-q-card").forEach(card => {
        const idx = parseInt(card.dataset.idx, 10);
        if (q.answers[idx] === undefined) card.classList.add("unanswered-flag");
      });
      alert(t("answerAllWarning"));
      return;
    }
    q.submitted = true;
    renderQuizContent();
  }

  function renderQuizResults() {
    const q = state.quiz;
    const container = document.getElementById("quizContent");
    let correctCount = 0;
    q.questions.forEach((question, idx) => {
      if (q.answers[idx] === question.correct) correctCount++;
    });
    const pct = Math.round((correctCount / q.questions.length) * 100);
    const quote = DATA.quotes[Math.floor(Math.random() * DATA.quotes.length)];
    const quoteText = state.lang === "ar" ? quote.ar : quote.en;

    let html = `<div class="results-wrap">
      <div class="results-ring" style="--pct:${pct}"><div class="results-ring-label">${pct}%</div></div>
      <div class="results-sub">${t("yourScore")}</div>
      <div class="results-score">${t("outOf", correctCount, q.questions.length)}</div>
      <div class="results-quote">${escapeHtml(quoteText)}</div>
      <div class="results-actions">
        <button class="btn-primary" id="retakeBtn">${t("retakeQuiz")}</button>
        <button class="btn-secondary" id="backBtn">${t("backToLabs")}</button>
      </div>
      <div class="results-review-list">`;

    q.questions.forEach((question, idx) => {
      const qText = state.lang === "ar" ? question.qAr : question.qEn;
      const opts = state.lang === "ar" ? question.optsAr : question.optsEn;
      const codeLike = isCodeLike(qText);
      const userAns = q.answers[idx];
      const correctAns = question.correct;

      html += `<div class="quiz-q-card">
        <div class="quiz-q-index">${t("quizQuestionOf", idx + 1, q.questions.length)}</div>
        <div class="quiz-q-text ${codeLike ? 'has-code' : ''}"${codeLike ? ' dir="ltr"' : ''}>${codeLike ? highlightPython(qText) : escapeHtml(qText)}</div>
        <div class="quiz-options">`;
      opts.forEach((opt, oi) => {
        let cls = "disabled";
        if (oi === correctAns) cls += " correct-ans";
        else if (oi === userAns) cls += " wrong-ans";
        const optCodeLike = /^[a-zA-Z_][a-zA-Z0-9_]*\(|def |print\(/.test(opt) && opt.length < 60 && !opt.includes(" the ") && !opt.includes(" a ");
        html += `<div class="quiz-option ${cls}">
          <div class="quiz-option-radio"></div>
          <div class="${optCodeLike ? 'quiz-option-code' : ''}"${optCodeLike ? ' dir="ltr"' : ''}>${escapeHtml(opt)}</div>
        </div>`;
      });
      html += `</div></div>`;
    });

    html += `</div></div>`;
    container.innerHTML = html;

    document.getElementById("retakeBtn").addEventListener("click", () => startQuiz(q.pool));
    document.getElementById("backBtn").addEventListener("click", closeQuiz);
  }

  /* ---------------------------------------------------------------
     INIT
     --------------------------------------------------------------- */
  function init() {
    initSplash();
    initHeader();
    document.getElementById("quizCloseBtn").addEventListener("click", closeQuiz);
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
