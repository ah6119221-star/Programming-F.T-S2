<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher⁷³ — Programming Principles I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CIPHER⁷³ — DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#121212;
  --surface:#1a1a1a;
  --surface-2:#1e1e1e;
  --surface-3:#232323;
  --border:#2b2b2b;
  --border-soft:#242424;
  --cyan:#00ffcc;
  --green:#00b38f;
  --cyan-dim:#00ffcc22;
  --green-dim:#00b38f22;
  --text:#eef1f0;
  --text-dim:#9aa39f;
  --text-faint:#6b746f;
  --danger:#ff5f6d;
  --danger-dim:#ff5f6d22;
  --ok:#00e6a8;
  --code-bg:#0c0d0d;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --font-head:'Space Grotesk', 'Cairo', sans-serif;
  --font-body:'Inter', 'Cairo', sans-serif;
  --font-code:'JetBrains Mono', monospace;
  --font-ar:'Cairo', 'Inter', sans-serif;
  --maxw:1180px;
}
html[dir="rtl"]{
  --font-head:'Cairo', sans-serif;
  --font-body:'Cairo', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, #00b38f14, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #00ffcc10, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{ font-family:var(--font-ar); }
h1,h2,h3,h4{ font-family:var(--font-head); margin:0; font-weight:600; letter-spacing:-0.01em; }
html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3, html[dir="rtl"] h4{ font-family:var(--font-ar); font-weight:700; letter-spacing:0; }
p{margin:0;}
button{font-family:inherit;}
::selection{ background:var(--cyan-dim); color:var(--cyan); }
a{ color:var(--cyan); }

/* Scrollbar */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:#2c2c2c; border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:#3a3a3a; }

.hidden{ display:none !important; }
.container{ max-width:var(--maxw); margin:0 auto; padding:0 20px; }

/* ============================================================
   SPLASH SCREEN
   ============================================================ */
.splash-overlay{
  position:fixed; inset:0; z-index:999;
  background:
    radial-gradient(1200px 700px at 50% 10%, #00b38f1c, transparent 60%),
    #0c0c0c;
  display:flex; align-items:center; justify-content:center;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.splash-card{
  text-align:center;
  padding:48px 40px;
  max-width:520px;
  width:92%;
}
.splash-mark{
  font-family:var(--font-head);
  font-size:clamp(2.4rem, 6vw, 3.4rem);
  font-weight:700;
  color:var(--text);
  margin-bottom:6px;
  letter-spacing:-0.02em;
}
.splash-mark .exp{
  color:var(--cyan);
  font-size:0.5em;
  vertical-align:super;
  margin-inline-start:2px;
}
.splash-mark .glow{
  background:linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.splash-sub{
  color:var(--text-dim);
  font-size:0.95rem;
  margin-bottom:36px;
  letter-spacing:0.02em;
}
.splash-choices{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
}
.splash-btn{
  flex:1 1 200px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:var(--radius-md);
  padding:20px 18px;
  cursor:pointer;
  font-size:1.05rem;
  font-weight:600;
  transition:border-color .18s ease, transform .18s ease, background .18s ease;
  position:relative;
  overflow:hidden;
}
.splash-btn:hover{
  border-color:var(--cyan);
  transform:translateY(-2px);
  background:#1d1f1e;
}
.splash-btn .flag-lang{
  display:block;
  font-size:0.72rem;
  color:var(--text-faint);
  font-weight:500;
  margin-top:6px;
  letter-spacing:0.04em;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  position:sticky; top:0; z-index:100;
  background:rgba(18,18,18,.86);
  backdrop-filter:blur(10px) saturate(140%);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{
  display:flex; align-items:center; gap:18px;
  padding:14px 20px;
  max-width:var(--maxw); margin:0 auto;
}
.brand{
  font-family:var(--font-head);
  font-weight:700;
  font-size:1.28rem;
  color:var(--text);
  white-space:nowrap;
  display:flex; align-items:baseline; gap:2px;
  cursor:default;
}
.brand .b-cipher{ color:var(--text); }
.brand .b-exp{ color:var(--cyan); font-size:0.55em; vertical-align:super; }
.brand-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); margin-inline-start:8px; box-shadow:0 0 10px var(--green); }

.tabs{
  display:flex; gap:4px;
  overflow-x:auto;
  flex:1;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tab-btn{
  background:transparent;
  border:1px solid transparent;
  color:var(--text-dim);
  padding:9px 14px;
  border-radius:999px;
  font-size:0.86rem;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.tab-btn:hover{ color:var(--text); }
.tab-btn.active{
  color:#0c0d0d;
  background:linear-gradient(90deg, var(--cyan), var(--green));
  border-color:transparent;
}
.lang-toggle{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 14px;
  border-radius:999px;
  font-weight:700;
  font-size:0.82rem;
  cursor:pointer;
  white-space:nowrap;
  transition:border-color .15s ease;
  display:flex; align-items:center; gap:6px;
}
.lang-toggle:hover{ border-color:var(--cyan); }
.lang-toggle .lg-ind{ width:6px; height:6px; border-radius:50%; background:var(--cyan); }

/* ============================================================
   MAIN LAYOUT / TAB PANELS
   ============================================================ */
main{ padding:32px 0 80px; }
.tab-panel{ display:none; animation:panelIn .3s ease; }
.tab-panel.active{ display:block; }
@keyframes panelIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.page-head{ margin-bottom:26px; }
.page-eyebrow{
  color:var(--green);
  font-size:0.78rem;
  font-weight:700;
  margin-bottom:6px;
  letter-spacing:0.04em;
}
.page-title{ font-size:clamp(1.5rem, 3vw, 2rem); color:var(--text); margin-bottom:8px; }
.page-desc{ color:var(--text-dim); font-size:0.95rem; max-width:640px; }

/* Summary accordion (Theory tab) */
.summary-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:36px; }
.summary-item{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.summary-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px;
  cursor:pointer;
  gap:12px;
}
.summary-header:hover{ background:#1d1f1e; }
.summary-header-left{ display:flex; align-items:center; gap:12px; min-width:0; }
.summary-num{
  flex-shrink:0;
  width:30px; height:30px;
  border-radius:8px;
  background:var(--green-dim);
  color:var(--green);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-code);
  font-size:0.82rem; font-weight:600;
}
.summary-title{ font-weight:600; font-size:0.98rem; color:var(--text); }
.chevron{
  flex-shrink:0;
  width:18px; height:18px;
  transition:transform .22s ease;
  color:var(--text-faint);
}
.summary-item.open .chevron{ transform:rotate(180deg); }
.summary-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .28s ease;
}
.summary-item.open .summary-body{ max-height:1400px; }
.summary-body-inner{
  padding:0 18px 18px 18px;
  border-top:1px solid var(--border-soft);
  padding-top:14px;
}
html[dir="rtl"] .summary-body-inner{ padding:14px 18px 18px 18px; }
.summary-bullets{ margin:0; padding-inline-start:20px; color:var(--text-dim); font-size:0.9rem; display:flex; flex-direction:column; gap:8px; }
.summary-bullets li::marker{ color:var(--cyan); }

/* Quiz launch card */
.quiz-launch{
  background:linear-gradient(160deg, var(--surface-2), var(--surface-3));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px;
  display:flex; align-items:center; justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.quiz-launch-text h3{ font-size:1.2rem; margin-bottom:6px; }
.quiz-launch-text p{ color:var(--text-dim); font-size:0.88rem; max-width:420px; }
.btn-primary{
  background:linear-gradient(90deg, var(--cyan), var(--green));
  color:#0a0b0b;
  border:none;
  padding:13px 26px;
  border-radius:999px;
  font-weight:700;
  font-size:0.92rem;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .15s ease, box-shadow .15s ease;
  box-shadow:0 8px 24px -8px #00b38f66;
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 28px -8px #00ffcc55; }
.btn-secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--border);
  padding:12px 22px;
  border-radius:999px;
  font-weight:600;
  font-size:0.88rem;
  cursor:pointer;
  transition:border-color .15s ease;
}
.btn-secondary:hover{ border-color:var(--cyan); color:var(--cyan); }
.btn-ghost{
  background:transparent; border:none; color:var(--text-dim);
  cursor:pointer; font-weight:600; font-size:0.85rem;
}
.btn-ghost:hover{ color:var(--text); }

/* ============================================================
   EXAMPLES & EXERCISES
   ============================================================ */
.filter-row{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center;
}
.filter-select{
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:999px;
  padding:10px 16px;
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
}
.filter-count{ color:var(--text-faint); font-size:0.82rem; }

.exercise-list{ display:flex; flex-direction:column; gap:10px; }
.exercise-item{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.exercise-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:15px 18px;
  cursor:pointer;
  gap:12px;
}
.exercise-header:hover{ background:#1d1f1e; }
.exercise-header-left{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.exercise-title{ font-weight:600; font-size:0.92rem; color:var(--text); }
.exercise-meta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.badge{
  font-size:0.7rem; font-weight:700;
  padding:3px 9px; border-radius:999px;
  font-family:var(--font-code);
  letter-spacing:0.02em;
}
.badge-page{ background:var(--cyan-dim); color:var(--cyan); }
.badge-lab{ background:var(--surface-3); color:var(--text-dim); border:1px solid var(--border); }
.badge-kind-worked{ background:var(--green-dim); color:var(--green); }
.badge-kind-practice{ background:#ffb02e22; color:#ffb02e; }

.exercise-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
.exercise-item.open .exercise-body{ max-height:3000px; }
.exercise-body-inner{ padding:0 18px 20px; border-top:1px solid var(--border-soft); padding-top:16px; }
.problem-text{ color:var(--text-dim); font-size:0.9rem; margin-bottom:14px; line-height:1.6; }
.solution-toggle-btn{
  background:var(--surface-3);
  border:1px solid var(--border);
  color:var(--cyan);
  padding:9px 18px;
  border-radius:999px;
  font-size:0.82rem;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.solution-toggle-btn:hover{ border-color:var(--cyan); background:var(--cyan-dim); }
.solution-block{ margin-top:14px; max-height:0; overflow:hidden; transition:max-height .35s ease; }
.solution-block.open{ max-height:2000px; }

/* Code editor look */
.code-box{
  background:var(--code-bg);
  border:1px solid #1c1d1d;
  border-radius:var(--radius-md);
  overflow:hidden;
  margin-top:6px;
  direction:ltr;
  unicode-bidi:isolate;
  text-align:left;
}
.code-box-head{
  display:flex; align-items:center; gap:6px;
  padding:9px 14px;
  background:#111212;
  border-bottom:1px solid #1c1d1d;
}
.code-dot{ width:9px; height:9px; border-radius:50%; }
.code-dot.r{ background:#ff5f57; } .code-dot.y{ background:#febc2e; } .code-dot.g{ background:#28c840; }
.code-box-label{ margin-inline-start:8px; font-family:var(--font-code); font-size:0.72rem; color:var(--text-faint); }
.code-box pre{
  margin:0; padding:16px 18px;
  overflow-x:auto;
  font-family:var(--font-code);
  font-size:0.83rem;
  line-height:1.65;
  color:#d7dedb;
}
.tok-kw{ color:var(--cyan); }
.tok-str{ color:#e6b673; }
.tok-com{ color:#6b746f; font-style:italic; }
.tok-num{ color:#ff9d76; }
.tok-fn{ color:var(--green); }
.tok-builtin{ color:#7fd6ff; }

/* ============================================================
   GLOSSARY
   ============================================================ */
.glossary-search{
  width:100%;
  max-width:420px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 18px;
  border-radius:999px;
  font-size:0.9rem;
  margin-bottom:24px;
}
.glossary-search:focus{ outline:none; border-color:var(--cyan); }
.glossary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:14px;
}
.glossary-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px;
}
.glossary-term{ color:var(--cyan); font-weight:700; font-size:0.98rem; margin-bottom:8px; font-family:var(--font-code); }
html[dir="rtl"] .glossary-term{ font-family:var(--font-ar); }
.glossary-def{ color:var(--text-dim); font-size:0.87rem; line-height:1.6; }
.glossary-empty{ color:var(--text-faint); text-align:center; padding:40px 0; }

/* ============================================================
   QUIZ MODAL
   ============================================================ */
.quiz-modal{
  position:fixed; inset:0; z-index:500;
  background:#0d0e0e;
  overflow-y:auto;
  animation:fadeIn .25s ease;
}
.quiz-modal-header{
  position:sticky; top:0; z-index:5;
  background:rgba(13,14,14,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
}
.quiz-progress-wrap{ flex:1; max-width:400px; }
.quiz-progress-track{ height:6px; background:var(--surface-3); border-radius:99px; overflow:hidden; }
.quiz-progress-fill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--green)); width:0%; transition:width .2s ease; }
.quiz-progress-label{ font-size:0.75rem; color:var(--text-faint); margin-top:6px; font-family:var(--font-code); }
.quiz-close-btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:1rem;
  display:flex; align-items:center; justify-content:center;
}
.quiz-close-btn:hover{ border-color:var(--danger); color:var(--danger); }

.quiz-body{ max-width:760px; margin:0 auto; padding:30px 20px 90px; }
.quiz-q-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:22px;
  margin-bottom:16px;
}
.quiz-q-card.unanswered-flag{ border-color:var(--danger); }
.quiz-q-index{ font-family:var(--font-code); color:var(--green); font-size:0.78rem; font-weight:700; margin-bottom:10px; }
.quiz-q-text{ font-size:1rem; font-weight:600; color:var(--text); margin-bottom:16px; white-space:pre-wrap; }
.quiz-q-text.has-code{ font-family:var(--font-code); font-size:0.85rem; font-weight:400; background:var(--code-bg); padding:14px 16px; border-radius:var(--radius-sm); direction:ltr; unicode-bidi:isolate; text-align:left; overflow-x:auto; }
.quiz-options{ display:flex; flex-direction:column; gap:9px; }
.quiz-option{
  display:flex; align-items:center; gap:12px;
  padding:13px 16px;
  background:var(--surface-3);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .15s ease;
  font-size:0.89rem;
}
.quiz-option:hover{ border-color:var(--cyan); }
.quiz-option.selected{ border-color:var(--cyan); background:var(--cyan-dim); }
.quiz-option-radio{
  flex-shrink:0;
  width:16px; height:16px; border-radius:50%;
  border:2px solid var(--text-faint);
  position:relative;
}
.quiz-option.selected .quiz-option-radio{ border-color:var(--cyan); }
.quiz-option.selected .quiz-option-radio::after{
  content:''; position:absolute; inset:2px; border-radius:50%; background:var(--cyan);
}
.quiz-option.correct-ans{ border-color:var(--ok); background:var(--green-dim); }
.quiz-option.correct-ans .quiz-option-radio{ border-color:var(--ok); }
.quiz-option.correct-ans .quiz-option-radio::after{ background:var(--ok); }
.quiz-option.wrong-ans{ border-color:var(--danger); background:var(--danger-dim); }
.quiz-option.wrong-ans .quiz-option-radio{ border-color:var(--danger); }
.quiz-option.wrong-ans .quiz-option-radio::after{ background:var(--danger); }
.quiz-option.disabled{ cursor:default; }
.quiz-option-code{ font-family:var(--font-code); direction:ltr; unicode-bidi:isolate; text-align:left; }

.quiz-submit-bar{
  position:sticky; bottom:0;
  background:rgba(13,14,14,.94);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border-soft);
  padding:16px 20px;
  display:flex; justify-content:center;
  margin-top:10px;
}

/* Results screen */
.results-wrap{ max-width:640px; margin:0 auto; padding:50px 20px 90px; text-align:center; }
.results-ring{
  width:170px; height:170px; margin:0 auto 22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  background:conic-gradient(var(--cyan) calc(var(--pct) * 1%), var(--surface-3) 0);
}
.results-ring::before{
  content:''; position:absolute; inset:10px; border-radius:50%; background:var(--bg);
}
.results-ring-label{ position:relative; z-index:2; font-family:var(--font-head); font-size:2.1rem; font-weight:700; }
.results-sub{ color:var(--text-dim); margin-bottom:6px; }
.results-score{ font-family:var(--font-code); color:var(--text-faint); font-size:0.9rem; margin-bottom:26px; }
.results-quote{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:20px 24px;
  font-style:italic;
  color:var(--cyan);
  margin-bottom:30px;
  font-size:0.98rem;
}
.results-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.results-review-list{ text-align:start; margin-top:36px; display:flex; flex-direction:column; gap:12px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 720px){
  .header-inner{ flex-wrap:wrap; }
  .brand{ order:1; }
  .lang-toggle{ order:2; margin-inline-start:auto; }
  .tabs{ order:3; width:100%; }
  .quiz-launch{ flex-direction:column; align-items:stretch; text-align:center; }
  .quiz-launch-text p{ max-width:none; }
  .glossary-grid{ grid-template-columns:1fr; }
}
@media (max-width: 480px){
  .splash-choices{ flex-direction:column; }
  .quiz-body{ padding:20px 14px 90px; }
}

/* Focus visibility for accessibility */
button:focus-visible, input:focus-visible, .exercise-header:focus-visible, .summary-header:focus-visible{
  outline:2px solid var(--cyan); outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }

امج تعمل بشكل أسرع", "لاكتشاف أخطاء وقت التشغيل ومعالجتها بلطف بدلاً من ترك البرنامج يتعطل", "لإزالة الحاجة إلى الدوال", "لإصلاح جميع الأخطاء في الكود تلقائياً"]}, {"id": 144, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "What happens to the code AFTER the statement that raised an exception, within the same try block?", "optsEn": ["It continues executing normally", "It is skipped, and control moves to the matching except block", "It executes twice", "The program restarts from the beginning"], "correct": 1, "qAr": "ماذا يحدث للكود الذي يأتي بعد الجملة التي تسبب استثناءً، ضمن نفس كتلة try؟", "optsAr": ["يستمر تنفيذه بشكل طبيعي", "يتم تخطيه، وينتقل التحكم إلى كتلة except المطابقة", "يتم تنفيذه مرتين", "يعيد البرنامج بدء التشغيل من جديد"]}, {"id": 145, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "Can a single try statement have multiple except blocks?", "optsEn": ["No, only one except block is ever allowed", "Yes, to handle different types of exceptions differently", "No, Python does not support this", "Only in Python 2, not Python 3"], "correct": 1, "qAr": "هل يمكن أن تحتوي جملة try واحدة على عدة كتل except؟", "optsAr": ["لا، يُسمح دائماً بكتلة except واحدة فقط", "نعم، للتعامل مع أنواع مختلفة من الاستثناءات بشكل مختلف", "لا، بايثون لا تدعم ذلك", "فقط في بايثون 2، وليس بايثون 3"]}, {"id": 146, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "If no exception occurs in the try block, what happens to the except block(s)?", "optsEn": ["They execute anyway", "They are skipped entirely", "They raise a new exception", "The program crashes"], "correct": 1, "qAr": "إذا لم يحدث أي استثناء في كتلة try، فماذا يحدث لكتلة (كتل) except؟", "optsAr": ["يتم تنفيذها على أي حال", "يتم تخطيها بالكامل", "تُصدر استثناءً جديداً", "يتعطل البرنامج"]}, {"id": 147, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "What is the benefit of catching a specific exception type (e.g., except ValueError:) rather than a bare except:?", "optsEn": ["There is no difference at all", "It lets the program handle that specific error appropriately while letting unexpected errors surface", "It makes the program run faster", "It prevents the program from ever crashing regardless of the error"], "correct": 1, "qAr": "ما فائدة التقاط نوع استثناء محدد (مثل except ValueError:) بدلاً من except: عامة؟", "optsAr": ["لا يوجد أي فرق على الإطلاق", "يسمح للبرنامج بمعالجة ذلك الخطأ المحدد بشكل مناسب مع ترك الأخطاء غير المتوقعة تظهر", "يجعل البرنامج يعمل أسرع", "يمنع البرنامج من التعطل مهما كان الخطأ"]}, {"id": 148, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "Which of the following is generally considered good practice with exception handling?", "optsEn": ["Wrapping the entire program in one giant try block with no except", "Handling only the specific exceptions you anticipate and can meaningfully respond to", "Never using try/except at all", "Using except to silence all errors without any message"], "correct": 1, "qAr": "أي مما يلي يُعد ممارسة جيدة عموماً في معالجة الاستثناءات؟", "optsAr": ["وضع البرنامج بأكمله داخل كتلة try عملاقة واحدة بدون except", "معالجة فقط الاستثناءات المحددة التي تتوقعها ويمكنك الاستجابة لها بشكل مفيد", "عدم استخدام try/except على الإطلاق", "استخدام except لإسكات جميع الأخطاء دون أي رسالة"]}, {"id": 149, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "Detecting and correcting errors in a program is generally known as:", "optsEn": ["Compiling", "Debugging", "Formatting", "Refactoring only"], "correct": 1, "qAr": "اكتشاف وتصحيح الأخطاء في برنامج يُعرف عموماً باسم:", "optsAr": ["الترجمة (Compiling)", "تصحيح الأخطاء (Debugging)", "التنسيق", "إعادة الهيكلة فقط"]} Start')\n    message()\n    print('End')\n\ndef message():\n    print('Middle')\n\nmain()", "optsAr": ["Start / Middle / End", "Middle / Start / End", "Start / End / Middle", "يحدث خطأ لأن message مُعرّفة بعد main"]}, {"id": 4, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "qEn": "What is wrong with the following code?\n\ndef greet():\nprint(\"Hi\")\n\ngreet()", "optsEn": ["Nothing, it runs fine", "The print statement is not indented, causing an IndentationError", "greet() cannot be called before being defined", "print is not a valid function"], "correct": 1, "qAr": "ما الخطأ في الكود التالي؟\n\ndef greet():\nprint(\"Hi\")\n\ngreet()", "optsAr": ["لا يوجد خطأ، يعمل بشكل صحيح", "جملة print غير مُزاحة، مما يسبب خطأ IndentationError", "لا يمكن استدعاء greet() قبل تعريفها", "print ليست دالة صحيحة"]}, {"id": 5, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "qEn": "def factorial(num):\n    result = 1\n    for i in range(1, num + 1):\n        result *= i\n    print(result)\n\nfactorial(4)", "optsEn": ["4", "24", "10", "1"], "correct": 1, "qAr": "ما ناتج الكود التالي؟\n\ndef factorial(num):\n    result = 1\n    for i in range(1, num + 1):\n        result *= i\n    print(result)\n\nfactorial(4)", "optsAr": ["4", "24", "10", "1"]}, {"id": 6, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "qEn": "Which of these correctly defines a function named show_total with no parameters?", "optsEn": ["function show_total(): ", "def show_total(): ", "def show_total; ", "show_total() def:"], "correct": 1, "qAr": "أي مما يلي يُعرّف دالة اسمها show_total بدون معاملات بشكل صحيح؟", "optsAr": ["function show_total(): ", "def show_total(): ", "def show_total; ", "show_total() def:"]}, {"id": 7, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "qEn": "def main():\n    pass\n\nmain()\nprint(\"Done\")", "optsEn": ["An error occurs because pass is invalid", "Prints 'Done' only, since pass does nothing", "Prints nothing at all", "Prints 'pass' then 'Done'"], "correct": 1, "qAr": "ما ناتج الكود التالي؟\n\ndef main():\n    pass\n\nmain()\nprint(\"Done\")", "optsAr": ["يحدث خطأ لأن pass غير صحيحة", "يطبع 'Done' فقط، لأن pass لا تفعل شيئاً", "لا يطبع شيئاً على الإطلاق", "يطبع 'pass' ثم 'Done'"]}, {"id": 8, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "qEn": "def show(x):\n    x = x + 10\n    print(\"Inside:\", x)\n\nnum = 5\nshow(num)\nprint(\"Outside:\", num)", "optsEn": ["Inside: 15 / Outside: 15", "Inside: 15 / Outside: 5", "Inside: 5 / Outside: 15", "An error occurs"], "correct": 1, "qAr": "ما ناتج الكود التالي؟\n\ndef show(x):\n    x = x + 10\n    print(\"Inside:\", x)\n\nnum = 5\nshow(num)\nprint(\"Outside:\", num)", "optsAr": ["Inside: 15 / Outside: 15", "Inside: 15 / Outside: 5", "Inside: 5 / Outside: 15", "يحدث خطأ"]}, {"id": 9, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "qEn": "def greet(name=\"Guest\"):\n    print(f\"Hello, {name}!\")\n\ngreet()\ngreet(\"Sara\")", "optsEn": ["Hello, Guest! / Hello, Guest!", "Hello, Guest! / Hello, Sara!", "An error because greet() has no argument", "Hello, Sara! / Hello, Sara!"], "correct": 1, "qAr": "ما ناتج الكود التالي؟\n\ndef greet(name=\"Guest\"):\n    print(f\"Hello, {name}!\")\n\ngreet()\ngreet(\"Sara\")", "optsAr": ["Hello, Guest! / Hello, Guest!", "Hello, Guest! / Hello, Sara!", "خطأ لأن greet() بدون وسيطة", "Hello, Sara! / Hello, Sara!"]}, {"id": 10, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "qEn": "def describe(name, age):\n    print(f\"{name} is {age} years old\")\n\ndescribe(age=20, name=\"Omar\")", "optsEn": ["Omar is 20 years old", "20 is Omar years old", "An error occurs because arguments (\"Cannot divide by zero\")", "optsEn": ["10", "An unhandled crash occurs", "Cannot divide by zero", "0"], "correct": 2, "qAr": "ما ناتج الكود التالي؟\n\ntry:\n    result = 10 / 0\nexcept ZeroDivisionError:\n    print(\"Cannot divide by zero\")", "optsAr": ["10", "يحدث تعطل غير معالَج", "Cannot divide by zero", "0"]}, {"id": 65, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "try:\n    num = int(\"abc\")\nexcept ValueError:\n    print(\"Invalid number\")\nprint(\"Done\")", "optsEn": ["Invalid number / Done", "Done only", "An unhandled ValueError crashes the program", "abc / Done"], "correct": 0, "qAr": "ما ناتج الكود التالي؟\n\ntry:\n    num = int(\"abc\")\nexcept ValueError:\n    print(\"Invalid number\")\nprint(\"Done\")", "optsAr": ["Invalid number / Done", "Done فقط", "يحدث تعطل غير معالَج بسبب ValueError", "abc / Done"]}, {"id": 66, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "try:\n    infile = open('ghost.txt', 'r')\nexcept FileNotFoundError:\n    print(\"File does not exist\")", "optsEn": ["An unhandled crash occurs", "File does not exist", "ghost.txt", "None"], "correct": 1, "qAr": "ما ناتج الكود التالي؟\n\ntry:\n    infile = open('ghost.txt', 'r')\nexcept FileNotFoundError:\n    print(\"File does not exist\")", "optsAr": ["يحدث تعطل غير معالَج", "File does not exist", "ghost.txt", "None"]}, {"id": 67, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "try:\n    x = [1, 2, 3]\n    print(x[5])\nexcept IndexError:\n    print(\"Index out of range\")\nexcept ValueError:\n    print(\"Value error\")", "optsEn": ["Index out of range", "Value error", "3", "An unhandled crash occurs"], "correct": 0, "qAr": "ما ناتج الكود التالي؟\n\ntry:\n    x = [1, 2, 3]\n    print(x[5])\nexcept IndexError:\n    print(\"Index out of range\")\nexcept ValueError:\n    print(\"Value error\")", "optsAr": ["Index out of range", "Value error", "3", "يحدث تعطل غير معالَج"]}, {"id": 68, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "try:\n    print(\"A\")\n    print(1 / 1)\n    print(\"B\")\nexcept ZeroDivisionError:\n    print(\"Error\")", "optsEn": ["A / 1.0 / B", "A / Error", "Error only", "A / B"], "correct": 0, "qAr": "ما ناتج الكود التالي؟\n\ntry:\n    print(\"A\")\n    print(1 / 1)\n    print(\"B\")\nexcept ZeroDivisionError:\n    print(\"Error\")", "optsAr": ["A / 1.0 / B", "A / Error", "Error فقط", "A / B"]}, {"id": 69, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(safe_divide(10, 2))\nprint(safe_divide(5, 0))", "optsEn": ["5.0 / None", "5.0 / 0", "An unhandled crash occurs on the second call", "None / None"], "correct": 0, "qAr": "ما ناتج الكود التالي؟\n\ndef safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(safe_divide(10, 2))\nprint(safe_divide(5, 0))", "optsAr": ["5.0 / None", "5.0 / 0", "يحدث تعطل غير معالَج في الاستدعاء الثاني", "None / None"]}, {"id": 70, "lab": 10, "labNameEn": "Debugging & Exception Handling", "labNameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "qEn": "Which structure correctly attempts risky code and handles a possible ValueError?", "optsEn": ["if ValueError: ... else: ...", "try: ... except ValueError: ...", "catch ValueError: ... finally: ...", "try: ... error ValueError: ..."], "correct": 1, "qAr": "أي بنية تحاول تنفيذ كود قد يسبب خطأً وتعالج احتمال حدوث ValueError بشكل صحيح؟", "optsAr": ["if ValueError: ... else: ...", "try: ... except ValueError: ...", "catch ValueError: ... finally: ...", "try: ... error ValueError: ..."]}], "glossary": [{"termEn": "Function", "defEn": "A named group of statements that performs a specific task and can be called (invoked) from elsewhere in a program.", "termAr": "الدالة (Function)", "defAr": "مجموعة من الجمل تحمل اسماً وتقوم بمهمة محددة، ويمكن استدعاؤها من أي مكان آخر في البرنامج."}, {"termEn": "Function Definition", "defEn": "The code block, starting with def, that specifies what a function does without executing it.", "termAr": "تعريف الدالة (Function Definition)", "defAr": "كتلة الكود التي تبدأ بـ def وتحدد ما تقوم به الدالة دون تنفيذها."}, {"termEn": "Function Call", "defEn": "A statement that executes the code inside a function by writing its name followed by parentheses.", "termAr": "استدعاء الدالة (Function Call)", "defAr": "جملة تُنفّذ الكود داخل دالة عن طريق كتابة اسمها متبوعاً بأقواس."}, {"termEn": "Parameter", "defEn": "A variable listed in a function's definition that receives an incoming value when the function is called.", "termAr": "المعامل (Parameter)", "defAr": "متغير مُدرج في تعريف الدالة يستقبل قيمة واردة عند استدعاء الدالة."}, {"termEn": "Argument", "defEn": "A value passed to a function when it is called, matched to the function's parameters.", "termAr": "الوسيطة (Argument)", "defAr": "قيمة تُمرَّر إلى دالة عند استدعائها، وتُطابق مع معاملات الدالة."}, {"termEn": "Return Value", "defEn": "The value a function sends back to the code that called it, using the return statement.", "termAr": "القيمة المُرجَعة (Return Value)", "defAr": "القيمة التي تُرسلها الدالة إلى الكود الذي استدعاها، باستخدام جملة return."}, {"termEn": "Scope", "defEn": "The region of a program where a variable can be accessed. Local scope is within a function; global scope is throughout the program.", "termAr": "النطاق (Scope)", "defAr": "المنطقة من البرنامج التي يمكن فيها الوصول إلى متغير معين. النطاق المحلي داخل الدالة؛ والنطاق العام في كل البرنامج."}, {"termEn": "Local Variable", "defEn": "A variable created inside a function, accessible only within that function.", "termAr": "المتغير المحلي (Local Variable)", "defAr": "متغير يُنشأ داخل دالة، ولا يمكن الوصول إليه إلا من داخلها."}, {"termEn": "Global Variable", "defEn": "A variable created outside all functions, accessible from anywhere in the program.", "termAr": "المتغير العام (Global Variable)", "defAr": "متغير يُنشأ خارج جميع الدوال، ويمكن الوصول إليه من أي مكان في البرنامج."}, {"termEn": "Default Argument", "defEn": "A value automatically used for a parameter if the caller does not supply an argument for it.", "termAr": "المعامل الافتراضي (Default Argument)", "defAr": "قيمة تُستخدم تلقائياً لمعامل إذا لم يُزوّده المستدعي بوسيطة."}, {"termEn": "Keyword Argument", "defEn": "An argument passed to a function by explicitly naming the parameter it corresponds to.", "termAr": "الوسيطة بالكلمة المفتاحية (Keyword Argument)", "defAr": "وسيطة تُمرَّر إلى دالة بتسمية المعامل الذي تقابله صراحةً."}, {"termEn": "String", "defEn": "A sequence of characters used to represent text in Python, enclosed in quotes.", "termAr": "النص (String)", "defAr": "سلسلة من الأحرف تُستخدم لتمثيل النصوص في بايثون، وتوضع بين علامتي اقتباس."}, {"termEn": "Slicing", "defEn": "An operation that extracts a sub-portion (span) of characters from a sequence such as a string or list.", "termAr": "التقطيع (Slicing)", "defAr": "عملية تستخرج جزءاً (مدى) من الأحرف من تسلسل مثل نص أو قائمة."}, {"termEn": "Concatenation", "defEn": "Joining two or more strings (or lists) together, typically using the + operator.", "termAr": "الدمج (Concatenation)", "defAr": "دمج نصين أو أكثر (أو قائمتين) معاً، عادة باستخدام العامل +."}, {"termEn": "Immutable", "defEn": "Describes an object whose value cannot be changed after it is created, such as strings and tuples.", "termAr": "غير قابل للتغيير (Immutable)", "defAr": "يصف كائناً لا يمكن تغيير قيمته بعد إنشائه، مثل النصوص والصفوف (tuples)."}, {"termEn": "Mutable", "defEn": "Describes an object whose contents can be changed after it is created, such as lists, sets, and dictionaries.", "termAr": "قابل للتغيير (Mutable)", "defAr": "يصف كائناً يمكن تغيير محتواه بعد إنشائه، مثل القوائم والمجموعات والقواميس."}, {"termEn": "List", "defEn": "An ordered, mutable collection of items in Python, created using square brackets [].", "termAr": "القائمة (List)", "defAr": "تجميعة مرتبة وقابلة للتغيير من العناصر في بايثون، تُنشأ باستخدام الأقواس المربعة []."}, {"termEn": "Index", "defEn": "A number representing the position of an element within a sequence, starting at 0.", "termAr": "الفهرس (Index)", "defAr": "رقم يمثل موضع عنصر داخل تسلسل، ويبدأ من 0."}, {"termEn": "Method", "defEn": "A function that belongs to an object and performs an operation using that object, called with dot notation (object.method()).", "termAr": "الدالة (Method)", "defAr": "دالة تنتمي إلى كائن وتقوم بعملية باستخدام ذلك الكائن، وتُستدعى بصيغة النقطة (object.method())."}, {"termEn": "del statement", "defEn": "A Python statement used to delete an item from a list, or a variable, or a key from a dictionary.", "termAr": "جملة del", "defAr": "جملة في بايثون تُستخدم لحذف عنصر من قائمة، أو متغير، أو مفتاح من قاموس."}, {"termEn": "Two-Dimensional List", "defEn": "A list of lists, often used to represent tabular data organized in rows and columns.", "termAr": "القائمة ثنائية الأبعاد", "defAr": "قائمة من القوائم، تُستخدم غالباً لتمثيل بيانات جدولية منظمة في صفوف وأعمدة."}, {"termEn": "Dictionary", "defEn": "An unordered collection of key:value pairs in Python, created using curly braces {}.", "termAr": "القاموس (Dictionary)", "defAr": "تجميعة غير مرتبة من أزواج مفتاح:قيمة في بايثون، تُنشأ باستخدام الأقواس المعقوفة {}."}, {"termEn": "Key", "defEn": "The unique identifier used to look up a corresponding value in a dictionary.", "termAr": "المفتاح (Key)", "defAr": "المُعرِّف الفريد المستخدم للبحث عن القيمة المقابلة له في القاموس."}, {"termEn": "Value (in a dictionary)", "defEn": "The data associated with a key in a dictionary.", "termAr": "القيمة (في القاموس)", "defAr": "البيانات المرتبطة بمفتاح معين في القاموس."}, {"termEn": "Tuple", "defEn": "An ordered, immutable collection of items in Python, typically created using parentheses ().", "termAr": "الصف (Tuple)", "defAr": "تجميعة مرتبة وغير قابلة للتغيير من العناصر في بايثون، تُنشأ عادة باستخدام الأقواس الدائرية ()."}, {"termEn": "Set", "defEn": "An unordered collection of unique elements in Python, created using curly braces {} or the set() function.", "termAr": "المجموعة (Set)", "defAr": "تجميعة غير مرتبة من عناصر فريدة (لا تكرار) في بايثون، تُنشأ باستخدام {} أو الدالة set()."}, {"termEn": "Union (Sets)", "defEn": "A set operation that combines all elements from two sets, removing duplicates.", "termAr": "الاتحاد (Union)", "defAr": "عملية على المجموعات تدمج جميع عناصر مجموعتين، مع إزالة التكرارات."}, {"termEn": "Intersection (Sets)", "defEn": "A set operation that returns only the elements common to two sets.", "termAr": "التقاطع (Intersection)", "defAr": "عملية على المجموعات تُرجع فقط العناصر المشتركة بين مجموعتين."}, {"termEn": "File Object", "defEn": "The object returned by Python's open() function, used to read from or write to a file.", "termAr": "كائن الملف (File Object)", "defAr": "الكائن الذي تُرجعه دالة open() في بايثون، ويُستخدم للقراءة من الملف أو الكتابة إليه."}, {"termEn": "Text File", "defEn": "A file containing data encoded as readable text characters, such as ASCII or Unicode.", "termAr": "الملف النصي (Text File)", "defAr": "ملف يحتوي على بيانات مُرمَّزة كأحرف نصية قابلة للقراءة، مثل ASCII أو Unicode."}, {"termEn": "Binary File", "defEn": "A file that stores data in a format not directly readable as text, often used for images or executables.", "termAr": "الملف الثنائي (Binary File)", "defAr": "ملف يخزن البيانات بصيغة لا يمكن قراءتها مباشرة كنص، ويُستخدم غالباً للصور أو الملفات التنفيذية."}, {"termEn": "Exception", "defEn": "An unwanted event that disrupts the normal flow of a program's execution, such as ZeroDivisionError.", "termAr": "الاستثناء (Exception)", "defAr": "حدث غير مرغوب يقاطع التدفق الطبيعي لتنفيذ البرنامج، مثل ZeroDivisionError."}, {"termEn": "try/except", "defEn": "A Python construct used to attempt risky code (try) and gracefully handle any resulting exception (except).", "termAr": "try/except", "defAr": "بنية في بايثون تُستخدم لمحاولة تنفيذ كود قد يفشل (try) ومعالجة أي استثناء ناتج بلطف (except)."}, {"termEn": "Debugging", "defEn": "The process of finding and correcting errors (bugs) in a program's code.", "termAr": "تصحيح الأخطاء (Debugging)", "defAr": "عملية إيجاد وتصحيح الأخطاء (bugs) في كود البرنامج."}, {"termEn": "Modularized Program", "defEn": "A program written so that each task is contained in its own function, improving readability and maintenance.", "termAr": "البرنامج المعياري (Modularized Program)", "defAr": "برنامج مكتوب بحيث تكون كل مهمة موجودة داخل دالتها الخاصة، مما يُحسّن الوضوح وسهولة الصيانة."}, {"termEn": "f-string", "defEn": "A formatted string literal in Python (prefixed with f) that allows embedding expressions directly inside string literals.", "termAr": "النص المُنسّق (f-string)", "defAr": "نص حرفي مُنسّق في بايثون (يبدأ بالحرف f) يسمح بتضمين تعبيرات مباشرة داخل النصوص."}, {"termEn": "Iteration", "defEn": "The process of repeating a set of instructions, often using a for or while loop, over each item in a sequence.", "termAr": "التكرار (Iteration)", "defAr": "عملية تكرار مجموعة من التعليمات، غالباً باستخدام حلقة for أو while، على كل عنصر في تسلسل."}], "summaries": [{"lab": 1, "nameEn": "Functions: Defining & Calling", "nameAr": "الدوال: التعريف والاستدعاء", "bulletsEn": ["A function is a group of statements that perform a specific task, allowing large programs to be divided into smaller, manageable pieces (divide and conquer).", "Benefits of using functions: simpler code, code reuse, and better testing/debugging.", "A function has two aspects: its definition (what it does) and its call (executing it).", "Functions are defined with the def keyword, a name, parentheses, and a colon.", "The indented block beneath the header is the function's body, executed each time the function runs.", "The pass keyword can be used as a placeholder statement that performs no action.", "Most programs use a main function to organize the overall program logic, calling other functions as needed."], "bulletsAr": ["الدالة هي مجموعة من الجمل التي تقوم بمهمة محددة، مما يسمح بتقسيم البرامج الكبيرة إلى أجزاء أصغر يسهل التعامل معها (فرّق تسد).", "من فوائد استخدام الدوال: كود أبسط، إعادة استخدام الكود، واختبار وتصحيح أفضل.", "للدالة جانبان: تعريفها (ما تقوم به) واستدعاؤها (تنفيذها).", "تُعرَّف الدوال باستخدام الكلمة المفتاحية def، متبوعة باسم، ثم أقواس، ثم نقطتين.", "الكتلة المُزاحة أسفل سطر العنوان هي جسم الدالة، وتُنفَّذ في كل مرة تعمل فيها الدالة.", "يمكن استخدام الكلمة المفتاحية pass كجملة بديلة لا تقوم بأي إجراء.", "تستخدم معظم البرامج دالة رئيسية main لتنظيم منطق البرنامج العام، مع استدعاء دوال أخرى حسب الحاجة."]}, {"lab": 2, "nameEn": "Functions In-depth: Parameters, Return Values & Scope", "nameAr": "الدوال بالتفصيل: المعاملات والقيم المُرجَعة والنطاق", "bulletsEn": ["Local variables are created inside a function and are accessible only within that function (local scope).", "Parameters are variables in a function's definition that receive values (arguments) passed during a call.", "Parameter variables have local scope, just like other variables created inside a function.", "Multiple arguments are matched to parameters by position, unless keyword arguments are used.", "Changing a parameter's value inside a function does not affect the original argument outside it (for simple/immutable values).", "Keyword arguments let you pass values by explicitly naming the parameter, allowing any order.", "Default arguments provide a value automatically if the caller does not supply one.", "Global variables are created outside all functions and can be accessed anywhere in the program; to modify one inside a function, it must be declared with the global keyword.", "Global constants represent values that should not change and are often written in uppercase by convention."], "bulletsAr": ["تُنشأ المتغيرات المحلية داخل دالة ويمكن الوصول إليها فقط من داخلها (نطاق محلي).", "المعاملات هي متغيرات في تعريف الدالة تستقبل القيم (الوسائط) المُمرَّرة عند الاستدعاء.", "متغيرات المعاملات لها نطاق محلي، تماماً مثل باقي المتغيرات المُنشأة داخل الدالة.", "تُطابق الوسائط المتعددة مع المعاملات حسب الترتيب، ما لم تُستخدم الوسائط بالكلمة المفتاحية.", "تغيير قيمة معامل داخل الدالة لا يؤثر على الوسيطة الأصلية خارجها (للقيم البسيطة غير القابلة للتغيير).", "تسمح الوسائط بالكلمة المفتاحية بتمرير القيم مع تسمية المعامل صراحةً، مما يتيح أي ترتيب.", "توفر المعاملات الافتراضية قيمة تلقائية إذا لم يزوّد المستدعي بواحدة.", "تُنشأ المتغيرات العامة خارج جميع الدوال ويمكن الوصول إليها من أي مكان بالبرنامج؛ ولتعديل متغير عام داخل دالة يجب الإعلان عنه بالكلمة global.", "تمثل الثوابت العامة قيماً لا يجب أن تتغير، وتُكتب عادةً بحروف كبيرة حسب العرف."]}, {"lab": 3, "nameEn": "String Manipulation", "nameAr": "معالجة النصوص (السلاسل)", "bulletsEn": ["A string is a sequence of characters, and each character has an index (position), starting at 0.", "Individual characters can be accessed with indexing, and a for loop can iterate over every character.", "The len() function returns the number of characters in a string.", "The + operator concatenates (joins) two strings together.", "Strings can be compared using ==, !=, <, and > based on the underlying character codes.", "The in and not in operators test whether a substring exists (or does not exist) within a string."], "bulletsAr": ["النص هو سلسلة من الأحرف، ولكل حرف فهرس (موضع)، يبدأ من 0.", "يمكن الوصول إلى الأحرف الفردية عبر الفهرسة، ويمكن لحلقة for المرور على كل حرف.", "تُرجع الدالة len() عدد الأحرف في النص.", "يقوم العامل + بدمج (تجميع) نصين معاً.", "يمكن مقارنة النصوص باستخدام == و != و< و> بناءً على رموز الأحرف.", "يختبر عاملا in و not in ما إذا كان نص فرعي موجوداً (أو غير موجود) داخل نص آخر."]}, {"lab": 4, "nameEn": "Working with Strings: Slicing, Joining, Methods & Formatting", "nameAr": "العمل مع النصوص: التقطيع والدمج والدوال والتنسيق", "bulletsEn": ["Slicing extracts a portion of a string using the syntax string[start:end], with an optional step value.", "The join() method combines a list of strings into one string using a specified separator.", "The split() method breaks a string into a list of substrings based on a separator.", "Strings are immutable: once created, their characters cannot be changed directly.", "String testing methods (like isdigit(), isalpha()) return True/False without modifying the string.", "Modification methods (like upper(), lower(), strip()) return a new, modified copy of the string.", "Searching and replacing methods (like find(), replace()) locate or substitute substrings.", "f-strings allow embedding variables and expressions directly inside string literals for easy formatting."], "bulletsAr": ["يستخرج التقطيع (slicing) جزءاً من النص باستخدام الصيغة string[start:end]، مع إمكانية إضافة قيمة خطوة.", "تقوم دالة join() بدمج قائمة من النصوص في نص واحد باستخدام فاصل محدد.", "تقوم دالة split() بتقسيم نص إلى قائمة من النصوص الفرعية بناءً على فاصل معين.", "النصوص غير قابلة للتغيير (immutable): بمجرد إنشائها، لا يمكن تغيير أحرفها مباشرة.", "دوال اختبار النصوص (مثل isdigit()، isalpha()) تُرجع True/False دون تعديل النص.", "دوال التعديل (مثل upper()، lower()، strip()) تُرجع نسخة جديدة معدّلة من النص.", "دوال البحث والاستبدال (مثل find()، replace()) تبحث عن نصوص فرعية أو تستبدلها.", "تسمح النصوص المنسقة (f-strings) بتضمين المتغيرات والتعبيرات مباشرة داخل النصوص لتنسيق سهل."]}, {"lab": 5, "nameEn": "Lists: Basics, Operations, Indexing & Slicing", "nameAr": "القوائم: الأساسيات والعمليات والفهرسة والتقطيع", "bulletsEn": ["A list is a mutable, ordered sequence of items created using square brackets [].", "A for loop can iterate directly over the elements of a list.", "Indexing (list[i]) accesses a specific element; len() returns the number of elements.", "Lists are mutable — individual elements can be reassigned after creation.", "The + operator concatenates two lists into a new combined list.", "List slicing (list[start:end]) returns a new list containing a specified range of elements.", "The in and not in operators test whether an item exists (or does not exist) within a list."], "bulletsAr": ["القائمة هي تسلسل مرتب وقابل للتغيير من العناصر تُنشأ باستخدام الأقواس المربعة [].", "يمكن لحلقة for المرور مباشرة على عناصر القائمة.", "الفهرسة (list[i]) تصل إلى عنصر محدد؛ وتُرجع len() عدد العناصر.", "القوائم قابلة للتغيير — يمكن إعادة إسناد عناصر فردية بعد الإنشاء.", "يقوم العامل + بدمج قائمتين في قائمة واحدة جديدة.", "تقطيع القائمة (list[start:end]) يُرجع قائمة جديدة تحتوي على مدى محدد من العناصر.", "يختبر عاملا in و not in ما إذا كان عنصر موجوداً (أو غير موجود) داخل قائمة."]}, {"lab": 6, "nameEn": "Lists: Methods & the del Statement", "nameAr": "القوائم: الدوال وجملة del", "bulletsEn": ["append() adds an item to the end of a list; insert() adds an item at a specific position.", "count() returns how many times a value appears; index() returns the position of its first occurrence.", "sort() arranges elements in order (ascending by default); reverse() reverses the element order.", "remove() deletes the first occurrence of a specified value from a list.", "The del statement removes an element at a specific index, or deletes an entire variable.", "sum(), min(), and max() are built-in functions useful for numeric lists.", "Assigning one list variable to another creates an alias (same object), not a true copy; use copy() or slicing [:] for an independent copy.", "A two-dimensional list (a list of lists) can represent tabular data with rows and columns, accessed as grid[row][col]."], "bulletsAr": ["تضيف append() عنصراً إلى نهاية القائمة؛ وتضيف insert() عنصراً في موضع محدد.", "تُرجع count() عدد مرات ظهور قيمة؛ وتُرجع index() موضع أول ظهور لها.", "ترتب sort() العناصر (تصاعدياً افتراضياً)؛ وتعكس reverse() ترتيب العناصر.", "تحذف remove() أول ظهور لقيمة محددة من القائمة.", "تُزيل جملة del عنصراً في فهرس محدد، أو تحذف متغيراً بالكامل.", "sum() و min() و max() دوال جاهزة مفيدة للقوائم الرقمية.", "إسناد متغير قائمة إلى آخر يُنشئ مرجعاً مستعاراً (نفس الكائن)، وليس نسخة حقيقية؛ استخدم copy() أو التقطيع [:] لنسخة مستقلة.", "يمكن للقائمة ثنائية الأبعاد (قائمة من القوائم) تمثيل بيانات جدولية بصفوف وأعمدة، ويُصل إليها بصيغة grid[row][col]."]}, {"lab": 7, "nameEn": "Dictionaries", "nameAr": "القواميس", "bulletsEn": ["A dictionary stores a collection of key:value pairs, created using curly braces {}.", "Values are retrieved using their key, e.g., dictionary[key].", "The in and not in operators test whether a key exists in a dictionary.", "New key:value pairs are added with dictionary[key] = value; del dictionary[key] removes one.", "Dictionary values can mix different data types, and dictionaries can be empty ({}).", "A for loop over a dictionary iterates over its keys by default.", "Useful methods include clear(), get(), items(), keys(), pop(), popitem(), and values().", "The merge operator (|) can combine two dictionaries into a new one."], "bulletsAr": ["يخزن القاموس مجموعة من أزواج مفتاح:قيمة، ويُنشأ باستخدام الأقواس المعقوفة {}.", "تُسترجَع القيم باستخدام مفاتيحها، مثل dictionary[key].", "يختبر عاملا in و not in ما إذا كان مفتاح موجوداً في القاموس.", "تُضاف أزواج مفتاح:قيمة جديدة بواسطة dictionary[key] = value؛ وتُزال بواسطة del dictionary[key].", "يمكن لقيم القاموس أن تخلط بين أنواع بيانات مختلفة، ويمكن أن يكون القاموس فارغاً ({}).", "المرور بحلقة for على قاموس يتم افتراضياً على مفاتيحه.", "من الدوال المفيدة: clear() و get() و items() و keys() و pop() و popitem() و values().", "يمكن لعامل الدمج (|) دمج قاموسين في قاموس جديد."]}, {"lab": 8, "nameEn": "Tuples and Sets", "nameAr": "الصفوف (Tuples) والمجموعات (Sets)", "bulletsEn": ["A tuple is an ordered, immutable sequence, typically created with parentheses ().", "Because tuples are immutable, individual elements cannot be reassigned after creation.", "A tuple can store a mutable object (like a list) as an element, and that object's contents can still change.", "list() and tuple() convert between lists and tuples.", "A set is an unordered collection of unique elements, created with {} (non-empty) or set() (empty).", "add() inserts a single element into a set; union(), intersection(), difference(), and symmetric_difference() perform standard set operations.", "issubset() and issuperset() test containment relationships between two sets."], "bulletsAr": ["الصف (tuple) هو تسلسل مرتب وغير قابل للتغيير، يُنشأ عادة باستخدام الأقواس الدائرية ().", "لأن الصفوف غير قابلة للتغيير، لا يمكن إعادة إسناد عناصر فردية بعد إنشائها.", "يمكن للصف تخزين كائن قابل للتغيير (مثل قائمة) كعنصر، ويمكن لا يزال تغيير محتوى ذلك الكائن.", "تحوّل list() و tuple() بين القوائم والصفوف.", "المجموعة (set) هي تجميعة غير مرتبة من عناصر فريدة، تُنشأ باستخدام {} (غير فارغة) أو set() (فارغة).", "تضيف add() عنصراً واحداً إلى مجموعة؛ وتؤدي union() و intersection() و difference() و symmetric_difference() عمليات المجموعات القياسية.", "تختبر issubset() و issuperset() علاقات الاحتواء بين مجموعتين."]}, {"lab": 9, "nameEn": "File I/O", "nameAr": "التعامل مع الملفات", "bulletsEn": ["Files can be text files (readable characters) or binary files (non-text data).", "The open() function creates a file object associated with a file on disk, given a filename and mode ('r', 'w', 'a').", "The write() method writes data to a file; numeric values must first be converted to strings with str().", "The read() method reads an entire file's contents as one string; readline() reads a single line at a time.", "A trailing \\n is often concatenated to written data so each item appears on its own line.", "Opening a file in 'w' mode overwrites existing content; 'a' mode appends without erasing.", "Loops are commonly used to process large amounts of data being written to or read from a file.", "close() should be called once file operations are finished to release the file properly."], "bulletsAr": ["يمكن أن تكون الملفات نصية (أحرف قابلة للقراءة) أو ثنائية (بيانات غير نصية).", "تُنشئ الدالة open() كائن ملف مرتبط بملف على القرص، بتحديد اسم الملف والوضع ('r' أو 'w' أو 'a').", "تكتب الدالة write() بيانات إلى ملف؛ ويجب تحويل القيم الرقمية إلى نصوص أولاً باستخدام str().", "تقرأ الدالة read() محتوى الملف بالكامل كنص واحد؛ وتقرأ readline() سطراً واحداً في كل مرة.", "غالباً ما يُضاف \\n في نهاية البيانات المكتوبة ليظهر كل عنصر في سطر منفصل.", "فتح ملف بوضع 'w' يكتب فوق المحتوى الموجود؛ ووضع 'a' يضيف دون مسح المحتوى.", "تُستخدم الحلقات عادة لمعالجة كميات كبيرة من البيانات التي تُكتب إلى ملف أو تُقرأ منه.", "يجب استدعاء close() عند الانتهاء من عمليات الملف لتحريره بشكل صحيح."]}, {"lab": 10, "nameEn": "Debugging & Exception Handling", "nameAr": "تصحيح الأخطاء ومعالجة الاستثناءات", "bulletsEn": ["An exception is an unwanted event that interrupts a program's normal flow during execution.", "Even syntactically correct statements can raise exceptions at runtime, such as dividing by zero.", "The try block contains code that might raise an exception; the except block handles it if one occurs.", "Common exceptions include ZeroDivisionError, ValueError, FileNotFoundError, and IndexError.", "A try statement can have multiple except blocks to handle different exception types differently.", "If no exception occurs, all except blocks are skipped and the program continues normally.", "Good practice is to catch specific exception types rather than using a bare except clause."], "bulletsAr": ["الاستثناء هو حدث غير مرغوب يقاطع التدفق الطبيعي للبرنامج أثناء التنفيذ.", "حتى الجمل الصحيحة نحوياً يمكن أن تُصدر استثناءات أثناء التشغيل، مثل القسمة على صفر.", "تحتوي كتلة try على كود قد يُصدر استثناءً؛ وتعالجه كتلة except إذا حدث.", "من الاستثناءات الشائعة: ZeroDivisionError و ValueError و FileNotFoundError و IndexError.", "يمكن أن تحتوي جملة try على عدة كتل except للتعامل مع أنواع استثناءات مختلفة بشكل مختلف.", "إذا لم يحدث أي استثناء، تُتخطى جميع كتل except ويستمر البرنامج بشكل طبيعي.", "من الممارسات الجيدة التقاط أنواع استثناءات محددة بدلاً من استخدام except عامة بلا تحديد."]}], "quotes": [{"en": "Code your way to success — one line at a time.", "ar": "اكتب طريقك نحو النجاح، سطراً تلو الآخر."}, {"en": "Great effort! Mastery is built on persistence.", "ar": "مجهود رائع! الاحتراف يُبنى بالمثابرة."}, {"en": "Every bug you fix makes you a sharper programmer.", "ar": "كل خطأ تصححه يجعلك مبرمجاً أكثر دقة."}, {"en": "Keep going — great programmers are made through practice.", "ar": "استمر في التقدم، فالمبرمجون المتميزون يُصنعون بالممارسة."}, {"en": "Debugging today builds the confidence of tomorrow.", "ar": "تصحيح أخطاء اليوم يبني ثقة الغد."}, {"en": "Learning to code is learning to think clearly.", "ar": "تعلّم البرمجة هو تعلّم التفكير بوضوح."}, {"en": "Small steps in practice lead to big leaps in skill.", "ar": "خطوات صغيرة في التمرين تقود إلى قفزات كبيرة في المهارة."}, {"en": "Consistency beats intensity — keep practicing daily.", "ar": "الاستمرارية أهم من الشدة، واظب على التمرين يومياً."}], "exercises": [{"id": 1, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 7, "kind": "worked", "titleEn": "Example 1: This program demonstrates a function. First, we define a function named ...", "titleAr": "مثال 1 — الدوال: التعريف والاستدعاء", "problemEn": "Study the program below — \"This program demonstrates a function. First, we define a function named ...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates a function.\n      # First, we define a function named message.\n      def message():\n        print(\"Hello,\")\n        print(\"from function\")\n\n      # Call the message function.\n      message()\n\nProgram Output\n\n      Hello,\n\n      from function"}, {"id": 2, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 8, "kind": "worked", "titleEn": "Example 2: This program has two functions. First we define the main function", "titleAr": "مثال 2 — الدوال: التعريف والاستدعاء", "problemEn": "Study the program below — \"This program has two functions. First we define the main function\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program has two functions. First we\n      # define the main function.\n      def main():\n        print('I have a message for you.')\n        message()\n        print('Goodbye!')\n\n      # Next we define the message function.\n      def message():\n        print(' Hello,')\n        print('from function')\n\n      # Call the main function.\n      main()\nProgram Output\n\n      I have a message for you.\n\n      Hello,\n\n      from function\n\n      Goodbye!"}, {"id": 3, "lab": 1, "labNameEn": "Functions: Defining & Calling", "labNameAr": "الدوال: التعريف والاستدعاء", "page": 9, "kind": "worked", "titleEn": "Example 3: Write a python program to find factorial of a given number using fu...", "titleAr": "مثال 3 — الدوال: التعريف والاستدعاء", "problemEn": "Write a python program to find factorial of a given number using functions.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "def factorial():\n\n             # Get input from user\n             num = int(input(\"Enter a number to find its factorial: \"))\n                         # Calculate factorial\n             result = 1\n             for i in range(1, num + 1):\n                   result *= i\n\n             # Display the result\n             print(f\"The factorial of {num} is: {result}\")\n\n        # Call the function\n        factorial()\n\nProgram Output\n      Enter a number to find its factorial: 5\n\n      The factorial of 5 is: 120\n\n   1.5.      Indentation in Python"}, {"id": 4, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 14, "kind": "worked", "titleEn": "Example 1: Definition of the main function", "titleAr": "مثال 1 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Definition of the main function\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# Definition of the main function.\n        def main():\n           name = get_name()\n           print(f'Hello {name}.')\n\n        # Definition of the get_name function.\n        def get_name():\n           name = input('Enter your name: ')\n           return name\n        # Call the main function.\n        main()"}, {"id": 5, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 16, "kind": "worked", "titleEn": "Example 2: This program demonstrates two functions that have local variables with t...", "titleAr": "مثال 2 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates two functions that have local variables with t...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates two functions that have local variables with the same name.\n      def main():\n        # Call the Khartoum function.\n        Khartoum()\n        # Call the Madani function.\n        Madani()\n      # Definition of the Khartoum function. It creates\n      # a local variable named birds.\n      def Khartoum():\n        birds = 5000\n        print(f'Khartoum has {birds} birds.')\n      # Definition of the Madani function. It also\n      # creates a local variable named birds.\n      def Madani():\n        birds = 8000\n        print(f'Madani has {birds} birds.')\n      # Call the main function.\n      main()\nProgram Output\n      Khartoum has 5000 birds.\n\n      Madani has 8000 birds."}, {"id": 6, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 17, "kind": "worked", "titleEn": "Example 3: Scope and Local Variables — Example 3", "titleAr": "مثال 3 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Scope and Local Variables — Example 3\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "test_variable = 5\ndef outer_function():\n     test_variable = 60\n\n     def inner_function():\n           test_variable = 100\n           print(f\"Local variable value of {test_variable} having local"}, {"id": 7, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 18, "kind": "worked", "titleEn": "Example 4: Passing Arguments to Functions - Concept — Example 4", "titleAr": "مثال 4 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Passing Arguments to Functions - Concept — Example 4\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "def main():\n             value = 5\n             show_double(value)\n      # The show_double function accepts an argument\n      # and displays double its value.\n      def show_double(number):\n             result = number * 2\n             print(result)\n      # Call the main function.\n\n      main()\nProgram Output"}, {"id": 8, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 20, "kind": "worked", "titleEn": "Example 5: Passing Multiple Arguments — Example 5", "titleAr": "مثال 5 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Passing Multiple Arguments — Example 5\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "def main():\n             def add_cubes(a, b):\n                 def cube_surface_area(x):\n                      return 6 * pow(x, 2)\n                 return cube_surface_area(a) + cube_surface_area(b)\n\n             result = add_cubes(2, 3)\n             print(f\"The surface area after adding two Cubes is {result}\")\n\n      main()\n\nProgram Output\n      The surface area after adding two Cubes is 78"}, {"id": 9, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 21, "kind": "worked", "titleEn": "Example 6: This program demonstrates a function that accepts two arguments", "titleAr": "مثال 6 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates a function that accepts two arguments\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates a function that accepts\n      # two arguments.\n\n      def main():\n             print('The sum of 12 and 45 is')\n             show_sum(12, 45)\n\n      # The show_sum function accepts two arguments\n      # and displays their sum.\n      def show_sum(num1, num2):\n             result = num1 + num2\n             print(result)\n\n      # Call the main function.\n      main()\nProgram Output\n\n      The sum of 12 and 45 is"}, {"id": 10, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 22, "kind": "worked", "titleEn": "Example 7: This program demonstrates a function that accepts two arguments", "titleAr": "مثال 7 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates a function that accepts two arguments\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates a function that accepts two arguments.\n       def main():\n              value1 = 2\n              value2 = 3\n              show_sum(value1, value2)\n\n       # The show_sum function accepts two arguments and displays their sum.\n       def show_sum(num1, num2):\n              result = num1 + num2\n              print(f'{num1} + {num2} = {result}')\n\n       # Call the main function.\n              main()\n\nProgram Output\n      2+3=5"}, {"id": 11, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 23, "kind": "worked", "titleEn": "Example 7: This program demonstrates what happens when you change the value of a pa...", "titleAr": "مثال 7 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates what happens when you change the value of a pa...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates what happens when you\n      # change the value of a parameter.\n      def main():\n             value = 99\n             print(f'The value is {value}.')\n             change_me(value)\n             print(f'Back in main the value is {value}.')\n\n      def change_me(arg):\n             print('I am changing the value.')\n             arg = 0\n             print(f'Now the value is {arg}.')\n      # Call the main function.\n      main()\nProgram Output\n      The value is 99.\n      I am changing the value.\n      Now the value is 0.\n      Back in main the value is 99."}, {"id": 12, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 24, "kind": "worked", "titleEn": "Example 8: This program demonstrates keyword arguments", "titleAr": "مثال 8 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates keyword arguments\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates keyword arguments.\n\n      def main():\n        # Show the amount of simple interest, using 0.01 as\n        # interest rate per period, 10 as the number of periods,\n        # and $10,000 as the principal.\n        show_interest(rate=0.01, periods=10, principal=10000.0)\n\n      # The show_interest function displays the amount of\n      # simple interest for a given principal, interest rate\n      # per period, and number of periods.\n\n      def show_interest(principal, rate, periods):\n        interest = principal * rate * periods\n        print(f'The simple interest will be ${interest:,.2f}.')\n      # Call the main function.\n      main()\n\nProgram Output"}, {"id": 13, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 25, "kind": "worked", "titleEn": "Example 9: This program demonstrates default arguments", "titleAr": "مثال 9 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"This program demonstrates default arguments\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program demonstrates default arguments.\n      def main():\n        # Use the default arguments for cols and rows.\n        display_stars()\n        print()\n\n        # Use 5 for cols and the default for rows.\n        display_stars(5)\n        print()\n\n        # Use 7 for cols and 3 for rows\n        display_stars(7, 3)\n\n      # This function displays rows and columns of asterisks.\n      def display_stars(cols=10, rows=1):\n\n           # The outer loop prints the rows and the\n           # inner loop prints the columns.\n           for row in range(rows):\n             for col in range(cols):\n               print('*', end='')\n             print()\n\n      main()\nProgram Output"}, {"id": 14, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 26, "kind": "worked", "titleEn": "Example 10: Global Variables — Example 10", "titleAr": "مثال 10 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Global Variables — Example 10\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "my_value = 10\n      # The show_value function prints the value of the global variable.\n      def show_value():\n           print(my_value)\n      # Call the show_value function.\n      show_value()\nProgram Output"}, {"id": 15, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 27, "kind": "worked", "titleEn": "Example 11: Create a global variable", "titleAr": "مثال 11 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"Create a global variable\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# Create a global variable.\n     number = 0\n\n     def main():\n       global number\n       number = int(input('Enter a number: '))\n       show_number()\n\n     def show_number():\n       print(f'The number you entered is {number}.')\n\n     # Call the main function.\n     main()\n     Program Output\n\n     Enter a number: 55 [Enter]\n\n     The number you entered is 55"}, {"id": 16, "lab": 2, "labNameEn": "Functions In-depth: Parameters & Scope", "labNameAr": "الدوال بالتفصيل: المعاملات والنطاق", "page": 27, "kind": "worked", "titleEn": "Example 12: The following is used as a global constant to represent the contribution...", "titleAr": "مثال 12 — الدوال بالتفصيل: المعاملات والنطاق", "problemEn": "Study the program below — \"The following is used as a global constant to represent the contribution...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# The following is used as a global constant to represent the contribution rate.\n     CONTRIBUTION_RATE = 0.05\n\n     def main():\n       gross_pay = float(input('Enter the gross pay: '))\n       bonus = float(input('Enter the amount of bonuses: '))\n\n  show_pay_contrib(gross_pay)\n  show_bonus_contrib(bonus)"}, {"id": 17, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 31, "kind": "worked", "titleEn": "Example 1: Create variables to reference two strings", "titleAr": "مثال 1 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"Create variables to reference two strings\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# Create variables to reference two strings.\n      first_name = 'Kathryn'\n      last_name = 'Marino'\n      # Display the values referenced by the variables.\n      print(first_name, last_name)\n      Program Output\n\n      Kathryn Marino"}, {"id": 18, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 32, "kind": "worked", "titleEn": "Example 2: Iterating over a String with the for Loop — Example 2", "titleAr": "مثال 2 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"Iterating over a String with the for Loop — Example 2\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "name = 'Juliet'\n      for ch in name:\n             print(ch)\n\nProgram Output\n\n      J\n      u\n      l\n      i\n      e\n      t"}, {"id": 19, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 33, "kind": "worked", "titleEn": "Example 3: This program counts the number of times the letter T (uppercase or lower...", "titleAr": "مثال 3 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"This program counts the number of times the letter T (uppercase or lower...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# This program counts the number of times the letter T (uppercase or lowercase)\n     # appears in a string.\n     def main():\n       # Create a variable to use to hold the count. The variable must start with 0.\n       count = 0\n\n       # Get a string from the user.\n       my_string = input('Enter a sentence: ')\n\n       # Count the Ts.\n       for ch in my_string:\n         if ch == 'T' or ch == 't':\n              count += 1\n\n       # Print the result.\n       print(f'The letter T appears {count} times.')\n\n     # Call the main function.\n     main()\nProgram Output"}, {"id": 20, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 33, "kind": "worked", "titleEn": "Example 4: Program to Print the Characters Which Are Common in Two Strings", "titleAr": "مثال 4 — معالجة النصوص (السلاسل)", "problemEn": "Program to Print the Characters Which Are Common in Two Strings", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "def common_characters(string_1, string_2):\n       for letter in string_1:\n         if letter in string_2:\n\n             print(f\"Character '{letter}' is found in both the strings\")\n      def main():\n         common_characters('rose', 'goose')\n      if __name__ == \"__main__\":\n         main()\nProgram Output\n\n      Character 'o' is found in both the strings\n      Character 's' is found in both the strings\n      Character 'e' is found in both the strings\n\n      Indexing"}, {"id": 21, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 34, "kind": "worked", "titleEn": "Example 5: Iterating over a String with the for Loop — Example 5", "titleAr": "مثال 5 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"Iterating over a String with the for Loop — Example 5\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "my_string = 'Roses are red'\n      ch = my_string[6]\n\nProgram Output\n\n             a"}, {"id": 22, "lab": 3, "labNameEn": "String Manipulation", "labNameAr": "معالجة النصوص (السلاسل)", "page": 35, "kind": "worked", "titleEn": "Example 6: String Concatenation — Example 6", "titleAr": "مثال 6 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"String Concatenation — Example 6\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "my_string = 'Roses are red "titleAr": "مثال 10 — معالجة النصوص (السلاسل)", "problemEn": "Study the program below — \"Testing Strings with in and not in — Example 10\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "names = 'Bill Joanne Susan Chris Juan Katie'\n      if 'Pierre' not in names:\n      print('Pierre was not found.')\n      else:\n      print('Pierre was found.')\n\nProgram Output\n\n      Pierre was not found."}, {"id": 27, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 40, "kind": "worked", "titleEn": "Example 1: 1. >>> healthy_drink = \"green tea\"", "titleAr": "مثال 1 — العمل مع النصوص: التقطيع والدوال", "problemEn": "1. >>> healthy_drink = \"green tea\"", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "2. >>> healthy_drink[0:3]\n      'gre'\n      3. >>> healthy_drink[:5]\n      'green'\n      4. >>> healthy_drink[6:]\n      'tea'\n      5. >>> healthy_drink[:]\n      'green tea'\n      6. >>> healthy_drink[4:4]\n      ''\n      7. >>> healthy_drink[6:20]\n      'tea'"}, {"id": 28, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 41, "kind": "worked", "titleEn": "Example 2: 1. >>> healthy_drink = \"green tea\"", "titleAr": "مثال 2 — العمل مع النصوص: التقطيع والدوال", "problemEn": "1. >>> healthy_drink = \"green tea\"", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "2. >>> healthy_drink[-3:-1]\n\n         'te'\n\n   3. >>> healthy_drink[6:-1]\n\n         'te'"}, {"id": 29, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 41, "kind": "worked", "titleEn": "Example 3: The get_login_name function accepts a first name, last name, and ID numb...", "titleAr": "مثال 3 — العمل مع النصوص: التقطيع والدوال", "problemEn": "Study the program below — \"The get_login_name function accepts a first name, last name, and ID numb...\" — and understand its output.", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "# The get_login_name function accepts a first name, last name, and ID number as\n      # arguments. It returnsa system login name.\n      def get_login_name(first, last, idnumber):\n        # Get the first three letters of the first name. If the name is less than 3 characters, the\n        # slice will return the entire first name.\n        set1 = first[0:3]\n          # Get the first three letters of the last name.If the name is less than 3 characters,\n        # the slice will return the entire last name.\n        set2 = last[0:3]\n         # Get the last three characters of the student ID. If the ID number is less than 3\n      # characters, the slice will return the entire ID number.\n\n        set3 = idnumber[-3:]\n        # Put the sets of characters together.\n      login_name = set1 + set2 + set3\n        # Return the login name.\n      return login_name\n    def main():\n      # Get the user's first name, last name, and ID number.\n      first = input('Enter your first name: ')\n      last = input('Enter your last name: ')\n      idnumber = input('Enter your student ID number: ')\n      # Get the login name.\n      print('Your system login name is:')\n      print(get_login_name(first, last, idnumber))\n    # Call the main function.\n    main()\nProgram Output\n    Enter your first name: Holly [Enter]\n    Enter your last name: Gaddis [Enter]\n    Enter your student ID number: CSC34899 [Enter]\n    Your system login name is:\n    HolGad899"}, {"id": 30, "lab": 4, "labNameEn": "Working with Strings", "labNameAr": "العمل مع النصوص: التقطيع والدوال", "page": 43, "kind": "worked", "titleEn": "Example 4: 1. >>> newspaper = \"new york times\"", "titleAr": "مثال 4 — العمل مع النصوص: التقطيع والدوال", "problemEn": "1. >>> newspaper = \"new york times\"", "problemAr": "ادرس البرنامج التالي وافهم مخرجاته.", "solution": "2. >>> newspaper[0:12:4]\n             'ny'\n             3. >>> newspa
